<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện Kana 21 Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: one centered working column (max 980px) with a sticky tab bar; each tool opens ready to use.
   Light-only by request: practice-notebook paper, indigo ink, shu-red seal for mastered characters. */
:root{
  --bg:#F2F4F8;
  --surface:#FFFFFF;
  --ink:#1C2140;
  --muted:#5A6180;
  --line:#DCE1EC;
  --line-soft:#ECEFF5;
  --accent:#2B47C2;
  --accent-ink:#FFFFFF;
  --accent-soft:#E7ECFC;
  --seal:#C63F29;
  --seal-ink:#FFFFFF;
  --seal-soft:#FCEDEA;
  --seal-line:#F0C9C0;
  --guide:#E5AFA3;
  --model:rgba(43,71,194,.17);
  --peek:rgba(198,63,41,.32);
  --ok:#1D7A52;
  --ok-soft:#E2F3EA;
  --bad:#B3312A;
  --bad-soft:#FBE6E4;
  --shadow:rgba(28,33,64,.08);
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-kana:"Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.seal{flex:0 0 auto;width:46px;height:46px;border-radius:8px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-kana);font-weight:600;font-size:15px;writing-mode:vertical-rl;letter-spacing:.08em;transform:rotate(-3deg)}
h1{font-size:1.45rem;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.meters{display:flex;gap:6px;flex-wrap:wrap}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter b{color:var(--ink);font-weight:600}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:14px;padding-block:8px}
.tabs-in{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;font-weight:600;font-size:.92rem;color:var(--muted);padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* Shared */
.panel{margin-top:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
h2{font-size:1.08rem;margin:0 0 4px;text-wrap:balance}
h3{font-size:1rem;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:.87rem;margin:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--line-soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:.87rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow),0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.92rem;padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.again{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{flex:0 0 auto}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:.85rem}
.progress{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.notice{background:var(--seal-soft);border:1px solid var(--seal-line);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:12px}
.empty-state{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
.kana{font-family:var(--f-kana)}

/* Picker */
.picker{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.pgroup{display:flex;gap:6px 10px;align-items:flex-start;flex-wrap:wrap}
.glabel{flex:0 0 92px;border:0;background:transparent;text-align:left;font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:7px 0;cursor:pointer}
.glabel[aria-pressed="true"]{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-family:var(--f-kana);font-size:1.02rem;cursor:pointer;color:var(--ink);line-height:1.5}
.chip.txt{font-family:var(--f-body);font-size:.84rem;font-weight:500;padding:5px 12px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pfoot{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:.86rem;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px}
.pfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.custom{background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.custom p{margin:0;font-size:.9rem}
.custom .kana{font-size:1.15rem;letter-spacing:.08em;word-break:break-all}

/* Chart */
.legend{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h span{color:var(--muted);font-size:.85rem}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:440px}
.cell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.cell .k{font-family:var(--f-kana);font-size:clamp(1.45rem,4.8vw,2.1rem);line-height:1.25}
.cell .r{font-size:.78rem;color:var(--muted)}
.cell:hover{border-color:var(--accent)}
.cell.ping{background:var(--accent-soft);border-color:var(--accent)}
.cell.blank{border:1px dashed var(--line-soft);background:transparent;cursor:default}
.stamp{width:18px;height:18px;border:1.5px solid var(--seal);color:var(--seal);border-radius:50%;font-family:var(--f-kana);font-size:10px;font-weight:600;display:inline-grid;place-items:center;line-height:1;transform:rotate(-10deg);background:var(--surface)}
.cell .stamp{position:absolute;top:4px;right:4px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.note h3{font-size:.96rem;margin-bottom:4px}
.note p{margin:0 0 10px;font-size:.87rem;color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex-b{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.ex-b:hover{border-color:var(--accent)}
.ex-b .k{font-family:var(--f-kana);font-size:1.1rem;line-height:1.3}
.ex-b .r{font-size:.75rem;color:var(--muted)}
.ex-b.ping{background:var(--accent-soft)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.word{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-width:0}
.word:hover{border-color:var(--accent)}
.word .k{font-family:var(--f-kana);font-size:1.4rem;line-height:1.3;word-break:break-all}
.word .wr{font-size:.8rem;color:var(--muted)}
.word[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.word[aria-expanded="true"] .wr{color:var(--ink)}

/* Flashcards */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage-top{width:min(100%,360px);display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.flash{width:min(100%,360px);height:250px;border:1px solid var(--line);border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 22px var(--shadow);
  background:linear-gradient(var(--line-soft),var(--line-soft)) center/1px 100% no-repeat,linear-gradient(var(--line-soft),var(--line-soft)) center/100% 1px no-repeat,var(--surface)}
.flash .big{font-family:var(--f-kana);font-size:6.2rem;line-height:1.1}
.flash .big.two{font-size:4.6rem}
.flash .rom{font-size:2.1rem;font-weight:700;color:var(--accent);line-height:1.2}
.flash .rom.front{font-size:3rem;color:var(--ink)}
.flash .small{font-family:var(--f-kana);font-size:2.4rem;line-height:1.2}
.flash .tap{font-size:.8rem;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;width:min(100%,360px)}
.actions .btn{flex:1}
.keys{font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}

/* Quiz */
.q-head{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);width:min(100%,400px);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:5px;width:min(100%,400px)}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line-soft);border:1px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.dots i.now{border:2px solid var(--accent);background:var(--surface)}
.q-kana{font-family:var(--f-kana);font-size:5.4rem;line-height:1.15;min-height:1.15em}
.q-kana.two{font-size:4.2rem}
.q-listen{width:110px;height:110px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.q-listen:hover{background:var(--accent);color:var(--accent-ink)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,400px)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-size:1.15rem;font-weight:600;cursor:pointer;min-width:0}
.opt.kana{font-family:var(--f-kana);font-size:1.9rem;font-weight:400;padding:8px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}
.fb{margin:0;font-size:.95rem;text-align:center}
.fb.ok{color:var(--ok)}
.fb.no{color:var(--bad)}
.fb .kana{font-size:1.2rem}
.score{font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.4rem;color:var(--muted);font-weight:600}
.settings{display:flex;flex-direction:column;gap:14px}
.setting-l{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.missed span{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:3px 9px;font-size:.85rem}
.missed span b{font-family:var(--f-kana);font-size:1.15rem;font-weight:400;margin-right:4px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

select{font:inherit;font-size:.92rem;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}

/* Vocabulary + grammar */
.word{position:relative}
.word .stamp{position:absolute;top:8px;right:8px}
.vw{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.flash .big.mid{font-size:3.2rem}
.flash .big.sm{font-size:2.1rem}
.flash .rd{font-family:var(--f-kana);font-size:1.5rem;color:var(--accent);line-height:1.3}
.flash .mean{font-size:1.3rem;font-weight:600;text-align:center;padding:0 14px;line-height:1.35}
.flash .mean.front{font-size:1.6rem}
.q-kana.mid{font-size:3rem}
.q-kana.sm{font-size:2rem;text-align:center}
.q-mean{font-size:1.6rem;font-weight:700;text-align:center;min-height:1.6em}
.opt.vo{font-size:1rem;padding:12px 8px}
.opt.kana.jw{font-size:1.25rem;padding:10px 6px}
.gnotes{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.gex{display:grid;gap:6px}
.gq .gtxt{font-family:var(--f-kana);font-size:1.3rem;margin:0 0 2px;color:var(--ink)}
.gq .gh{margin:0 0 10px;color:var(--muted);font-size:.87rem}
.gopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt.gopt{font-family:var(--f-kana);font-size:1rem;font-weight:500;padding:10px 8px}
.gq .fb{text-align:left;margin-top:10px;font-size:.87rem}
.gsum{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:10px}
.reset{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .cell,.ex-b,.chip,.opt,.btn,.word{transition:background-color .15s,border-color .15s}
  .progress i{transition:width .3s}
}
</style>

</head>
<body style="margin:0">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">かな</div>
      <div>
        <h1>Luyện Tiếng Nhật Sơ Cấp</h1>
        <p class="sub">Kana, từ vựng và ngữ pháp theo giáo trình Minna no Nihongo</p>
      </div>
    </div>
    <div class="meters" id="meters"></div>
  </header>

  <nav class="tabs" aria-label="Các phần luyện tập">
    <div class="tabs-in" role="tablist" id="tabs"></div>
  </nav>

  <section class="panel" id="p-bang" role="tabpanel" hidden></section>
  <section class="panel" id="p-the" role="tabpanel" hidden></section>
  <section class="panel" id="p-kiemtra" role="tabpanel" hidden></section>
  <section class="panel" id="p-tuvung" role="tabpanel" hidden></section>
  <section class="panel" id="p-nguphap" role="tabpanel" hidden></section>
  <div class="reset" id="reset"></div>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const toKata = s => s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Data ---------- */
const ROWS = [
  {id:'a',g:'basic',c:[['あ','a'],['い','i'],['う','u'],['え','e'],['お','o']]},
  {id:'k',g:'basic',c:[['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko']]},
  {id:'s',g:'basic',c:[['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so']]},
  {id:'t',g:'basic',c:[['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to']]},
  {id:'n',g:'basic',c:[['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no']]},
  {id:'h',g:'basic',c:[['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho']]},
  {id:'m',g:'basic',c:[['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo']]},
  {id:'y',g:'basic',c:[['や','ya'],null,['ゆ','yu'],null,['よ','yo']]},
  {id:'r',g:'basic',c:[['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro']]},
  {id:'w',g:'basic',c:[['わ','wa'],null,null,null,['を','wo'],['ん','n']]},
  {id:'g',g:'dak',c:[['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go']]},
  {id:'z',g:'dak',c:[['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo']]},
  {id:'d',g:'dak',c:[['だ','da'],['ぢ','ji'],['づ','zu'],['で','de'],['ど','do']]},
  {id:'b',g:'dak',c:[['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo']]},
  {id:'p',g:'dak',c:[['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po']]},
  {id:'ky',g:'yoon',c:[['きゃ','kya'],['きゅ','kyu'],['きょ','kyo']]},
  {id:'sh',g:'yoon',c:[['しゃ','sha'],['しゅ','shu'],['しょ','sho']]},
  {id:'ch',g:'yoon',c:[['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho']]},
  {id:'ny',g:'yoon',c:[['にゃ','nya'],['にゅ','nyu'],['にょ','nyo']]},
  {id:'hy',g:'yoon',c:[['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo']]},
  {id:'my',g:'yoon',c:[['みゃ','mya'],['みゅ','myu'],['みょ','myo']]},
  {id:'ry',g:'yoon',c:[['りゃ','rya'],['りゅ','ryu'],['りょ','ryo']]},
  {id:'gy',g:'yoon',c:[['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo']]},
  {id:'j',g:'yoon',c:[['じゃ','ja'],['じゅ','ju'],['じょ','jo']]},
  {id:'by',g:'yoon',c:[['びゃ','bya'],['びゅ','byu'],['びょ','byo']]},
  {id:'py',g:'yoon',c:[['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo']]},
  {id:'ext',g:'ext',kataOnly:true,c:[['ファ','fa'],['フィ','fi'],['フェ','fe'],['フォ','fo'],['ティ','ti'],['ディ','di'],['ウィ','wi'],['ウェ','we'],['ウォ','wo'],['シェ','she'],['ジェ','je'],['チェ','che'],['ヴ','vu']]}
];
const BASIC = ['a','k','s','t','n','h','m','y','r','w'];
const DAK = ['g','z','d','b','p'];
const YOON = ['ky','sh','ch','ny','hy','my','ry','gy','j','by','py'];
const GROUPS = [
  {g:'basic',label:'Cơ bản',ids:BASIC},
  {g:'dak',label:'Âm đục',ids:DAK},
  {g:'yoon',label:'Âm ghép',ids:YOON},
  {g:'ext',label:'Mở rộng',ids:['ext'],kataOnly:true},
  {g:'conf',label:'Luyện riêng',ids:['conf']}
];
const ROWMAP = Object.fromEntries(ROWS.map(r => [r.id, r]));
const ITEMS = {};
const BYROW = {hira:{}, kata:{}};
for (const row of ROWS) {

/* ---------- Storage ---------- */
const KEY = 'luyen-kana-21-v1';
let store = {stats:{}, gbest:{}, tab:'bang'};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') store = Object.assign(store, s); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function mark(k, ok){
  const s = store.stats[k] || (store.stats[k] = {c:0, w:0});
  if (ok) s.c++; else s.w++;
  save(); renderMeters();
}
function mastered(k){ const s = store.stats[k]; return !!s && s.c >= 3 && s.c >= 2 * s.w; }

{t:'なん và だれの: hỏi cái gì, của ai',p:'<b>なんですか</b> hỏi tên vật hoặc đây là cái gì. <b>だれの N ですか</b> hỏi chủ sở hữu và trả lời bằng <b>tên người + の</b>. <b>なんの N</b> hỏi loại hoặc nội dung của N.',ex:[['それは なんの ほんですか。','Đó là sách về gì vậy?'],['にほんごの ほんです。','Là sách tiếng Nhật.'],['あの かばんは だれのですか。','Cái cặp kia là của ai?'],['サントスさんのです。','Của anh Santos.']]},
{t:'Tặng quà và đáp lại',p:'Khi đưa quà, nói <b>これ、ほんの きもちです</b> (chút lòng thành). Người nhận đáp <b>どうも ありがとうございます</b>. Khi dọn đến nhà mới hoặc gặp hàng xóm: <b>これから おせわになります</b>, đối phương đáp <b>こちらこそ どうぞ よろしく</b>.',ex:[['あのう、これ、ほんの きもちです。','À này, đây là chút lòng thành.'],['どうも ありがとうございます。','Xin cảm ơn anh.'],['こちらこそ どうぞ よろしく。','Tôi mới là người mong được giúp đỡ.']]}
],
q:[
{j:'＿は ほんです。',h:'Quyển sách ở gần người nghe, ở xa người nói. Chỗ trống điền:',o:['これ','それ','あれ','この'],a:1,e:'Vật ở gần người nghe dùng それ.'},
{j:'＿ かばんは わたしのです。',h:'Cái cặp này là của tôi.',o:['これ','それ','この','あれ'],a:2,e:'Cần danh từ (かばん) đi liền sau nên phải dùng この chứ không phải これ.'},
{j:'これは だれ＿ かさですか。',h:'Đây là ô của ai vậy?',o:['の','は','も','を'],a:0,e:'だれの N = N của ai.'},
{j:'',h:'"それは ほんですか。" Câu trả lời khi KHÔNG phải sách:',o:['いいえ、そうじゃ ありません。','はい、そうです。','いいえ、そうです。','はい、ちがいます。'],a:0,e:'Phủ định dùng いいえ, kèm そうじゃ ありません hoặc ちがいます.'},
{j:'あれは なんですか。',h:'Câu trả lời tự nhiên nhất cho câu hỏi này:',o:['とけいです。','はい、そうです。','いいえ、ちがいます。','わたしのです。'],a:0,e:'なんですか hỏi tên vật nên trả lời bằng tên vật.'},
{j:'＿ ほんは ミラーさんのです。',h:'Quyển sách ở xa cả hai người, là của anh Miller.',o:['この','その','あの','あれ'],a:2,e:'Vật ở xa cả hai là あの, đi kèm danh từ.'},
{j:'これは コンピューター＿ ほんです。',h:'Đây là sách về máy tính.',o:['は','の','も','か'],a:1,e:'の cho biết chủ đề: sách về máy tính.'}
]},

{n:3, t:'Địa điểm và giá cả',
v:[
'ここ||chỗ này, ở đây','そこ||chỗ đó','あそこ||chỗ kia','どこ||ở đâu','こちら||phía này, chỗ này (lịch sự)','そちら||phía đó (lịch sự)','あちら||phía kia (lịch sự)','どちら||phía nào, ở đâu (lịch sự)',
'教室|きょうしつ|phòng học','食堂|しょくどう|nhà ăn','事務所|じむしょ|văn phòng','会議室|かいぎしつ|phòng họp','受付|うけつけ|quầy lễ tân','ロビー||sảnh','部屋|へや|căn phòng','トイレ||nhà vệ sinh','階段|かいだん|cầu thang','エレベーター||thang máy','エスカレーター||thang cuốn','自動販売機|じどうはんばいき|máy bán hàng tự động',
'電話|でんわ|điện thoại','お国|おくに|đất nước (của bạn)','会社|かいしゃ|công ty','うち||nhà','靴|くつ|giày','ネクタイ||cà vạt','ワイン||rượu vang','たばこ||thuốc lá','売り場|うりば|quầy bán hàng','地下|ちか|tầng hầm',
'～階|～かい|tầng ～','何階|なんがい|tầng mấy','～円|～えん|～yên','いくら||bao nhiêu tiền','百|ひゃく|trăm','千|せん|nghìn','万|まん|vạn (mười nghìn)',
'すみません||xin lỗi, cho hỏi','～を見せてください|～をみせてください|xin cho tôi xem ～','～をください||xin cho tôi ～','じゃ||vậy thì','～でございます||là ～ (dạng rất lịch sự của です)'
],
g:[
{t:'ここ / そこ / あそこ / どこ',p:'Bốn từ chỉ nơi chốn, cùng quy tắc xa gần với これ, それ, あれ: <b>ここ</b> gần người nói, <b>そこ</b> gần người nghe, <b>あそこ</b> xa cả hai, <b>どこ</b> dùng để hỏi. Các dạng lịch sự là <b>こちら, そちら, あちら, どちら</b>, thường dùng khi chỉ đường hoặc hỏi nơi chốn với người mới quen.',ex:[['ここは しょくどうです。','Đây là nhà ăn.'],['トイレは どこですか。','Nhà vệ sinh ở đâu?'],['あそこです。','Ở đằng kia.'],['でんわは あちらです。','Điện thoại ở phía kia ạ.']]},
{t:'N は địa điểm です: N ở đâu',p:'Để nói người hoặc vật ở một nơi nào đó, dùng cấu trúc <b>N は ここ/そこ/あそこ です</b>. Hỏi bằng <b>N は どこですか</b>. Bài này chưa dùng động từ "ở" (います, あります) nên mọi câu vị trí đều kết thúc bằng です.',ex:[['エレベーターは あそこです。','Thang máy ở đằng kia.'],['ミラーさんは じむしょです。','Anh Miller ở văn phòng.'],['かいぎしつは どこですか。','Phòng họp ở đâu vậy?']]},
{t:'Hỏi quê hương, công ty, nơi sản xuất',p:'Với người mới quen, dùng <b>どちら</b> để hỏi lịch sự về đất nước hay công ty: <b>おくには どちらですか</b>. <b>どこの N</b> hỏi vật đó do nước nào hoặc hãng nào sản xuất, trả lời bằng <b>tên nước/hãng + の</b>.',ex:[['おくには どちらですか。','Đất nước của anh là nước nào ạ?'],['ベトナムです。','Là Việt Nam.'],['それは どこの くるまですか。','Đó là ô tô của hãng, nước nào vậy?'],['ドイツのです。','Của Đức.']]},
{t:'いくらですか: hỏi giá, và cách đếm số tiền',p:'<b>いくらですか</b> hỏi giá, trả lời <b>số + えん</b>. Các mốc: 百 <b>ひゃく</b> (100), 千 <b>せん</b> (1000), 万 <b>まん</b> (10000). Có biến âm: 300 <b>さんびゃく</b>, 600 <b>ろっぴゃく</b>, 800 <b>はっぴゃく</b>, 3000 <b>さんぜん</b>, 8000 <b>はっせん</b>. Với 10000 phải nói <b>いちまん</b>, không bỏ いち.',ex:[['この ワインは いくらですか。','Chai rượu này bao nhiêu tiền?'],['さんぜんえんです。','3.000 yên.'],['そのかばんは ろっぴゃくえんです。','Cái cặp đó giá 600 yên.'],['これは いちまんえんです。','Cái này 10.000 yên.']]},
{t:'～かい: số tầng',p:'Đếm tầng bằng <b>số + かい</b>. Biến âm cần nhớ: 1 <b>いっかい</b>, 3 <b>さんがい</b>, 6 <b>ろっかい</b>, 8 <b>はっかい</b>, 10 <b>じゅっかい</b>; còn lại đọc thường như 2 <b>にかい</b>, 4 <b>よんかい</b>, 5 <b>ごかい</b>. Hỏi tầng bằng <b>なんがい</b>. Tầng hầm là <b>ちか</b>.',ex:[['うりばは なんがいですか。','Quầy bán hàng ở tầng mấy?'],['さんがいです。','Ở tầng 3.'],['しょくどうは ちか いっかいです。','Nhà ăn ở tầng hầm 1.']]},
{t:'Mua sắm: ～を ください / ～を みせてください',p:'Khi mua hàng: <b>これを ください</b> là xin cho tôi cái này (muốn mua). <b>～を みせて ください</b> là xin cho tôi xem ～. Mở lời hỏi nhân viên bằng <b>すみません</b>. <b>じゃ</b> mở đầu khi bạn đã quyết định chọn.',ex:[['すみません、その くつを みせて ください。','Xin lỗi, cho tôi xem đôi giày đó.'],['いくらですか。','Bao nhiêu tiền vậy?'],['じゃ、これを ください。','Vậy thì cho tôi cái này.']]}
],
q:[
{j:'トイレは ＿ ですか。',h:'Nhà vệ sinh ở đâu?',o:['どこ','なん','だれ','いくら'],a:0,e:'どこ dùng để hỏi nơi chốn.'},
{j:'この ワインは ＿ ですか。',h:'Chai rượu này bao nhiêu tiền? (trả lời: 3.000 yên)',o:['なん','どこ','いくら','だれ'],a:2,e:'いくら hỏi giá tiền.'},
{j:'しょくどうは ＿ です。',h:'Nhà ăn ở đằng kia, xa cả hai người.',o:['ここ','そこ','あそこ','どこ'],a:2,e:'Chỗ xa cả hai người nói và nghe là あそこ.'},
{j:'',h:'Cách nói lịch sự hơn của ここ là:',o:['こちら','どちら','あちら','そちら'],a:0,e:'こちら, そちら, あちら, どちら là dạng lịch sự của ここ, そこ, あそこ, どこ.'},
{j:'この くつを ＿。',h:'Xin cho tôi đôi giày này (tôi muốn mua).',o:['ください','です','ですか','みます'],a:0,e:'～を ください dùng để xin hoặc mua hàng.'},
{j:'',h:'300 yên đọc là:',o:['さんびゃくえん','さんひゃくえん','みっひゃくえん','さんぜんえん'],a:0,e:'300 là さんびゃく, có biến âm びゃく.'},
{j:'それは ＿ の とけいですか。',h:'Đồng hồ đó của nước nào, hãng nào sản xuất? (trả lời: スイスのです)',o:['どこ','だれ','なん','いくら'],a:0,e:'どこの N hỏi nơi sản xuất hoặc hãng của N.'},
{j:'',h:'Tầng 3 đọc là:',o:['さんがい','さんかい','みっかい','さんつ'],a:0,e:'3 tầng là さんがい, có biến âm.'}
]},

{n:4, t:'Giờ giấc và sinh hoạt hằng ngày',
v:[
'起きます|おきます|thức dậy','寝ます|ねます|ngủ, đi ngủ','働きます|はたらきます|làm việc','休みます|やすみます|nghỉ ngơi, nghỉ làm','勉強します|べんきょうします|học','終わります|おわります|kết thúc, xong',
'デパート||bách hóa','銀行|ぎんこう|ngân hàng','郵便局|ゆうびんきょく|bưu điện','図書館|としょかん|thư viện','美術館|びじゅつかん|bảo tàng mỹ thuật',
'今|いま|bây giờ','～時|～じ|～giờ','～分|～ふん／ぷん|～phút','半|はん|rưỡi, nửa','何時|なんじ|mấy giờ','何分|なんぷん|mấy phút','午前|ごぜん|sáng (AM)','午後|ごご|chiều (PM)',
'朝|あさ|buổi sáng','昼|ひる|buổi trưa','晩|ばん|buổi tối','おととい||hôm kia','昨日|きのう|hôm qua','今日|きょう|hôm nay','明日|あした|ngày mai','あさって||ngày kia','今朝|けさ|sáng nay','今晩|こんばん|tối nay',
'休み|やすみ|nghỉ, ngày nghỉ','昼休み|ひるやすみ|nghỉ trưa','試験|しけん|kỳ thi','会議|かいぎ|cuộc họp','映画|えいが|phim','毎朝|まいあさ|mỗi sáng','毎晩|まいばん|mỗi tối','毎日|まいにち|mỗi ngày',
'月曜日|げつようび|thứ Hai','火曜日|かようび|thứ Ba','水曜日|すいようび|thứ Tư','木曜日|もくようび|thứ Năm','金曜日|きんようび|thứ Sáu','土曜日|どようび|thứ Bảy','日曜日|にちようび|Chủ nhật','何曜日|なんようび|thứ mấy',
'～から||từ ～','～まで||đến ～','～と||và ～','番号|ばんごう|số, mã số','何番|なんばん|số mấy','大変ですね|たいへんですね|vất vả nhỉ'
],
g:[
{t:'Nói giờ: いま ～じ ～ふん です',p:'Giờ đọc <b>số + じ</b>, phút đọc <b>số + ふん/ぷん</b>, 30 phút nói là <b>はん</b>. Cần nhớ: 4 giờ là <b>よじ</b>, 7 giờ <b>しちじ</b>, 9 giờ <b>くじ</b>. Phút có biến âm: 1 <b>いっぷん</b>, 3 <b>さんぷん</b>, 4 <b>よんぷん</b>, 6 <b>ろっぷん</b>, 8 <b>はっぷん</b>, 10 <b>じゅっぷん</b>; còn lại đọc <b>ふん</b> (2 にふん, 5 ごふん, 7 ななふん, 9 きゅうふん). Trước giờ có thể thêm <b>ごぜん</b> (sáng) và <b>ごご</b> (chiều).',ex:[['いま なんじですか。','Bây giờ là mấy giờ vậy?'],['いま 4じ 5ふんです。','Bây giờ là 4 giờ 5 phút.'],['ごぜん 9じ はんです。','9 giờ rưỡi sáng.']]},
{t:'V ます: động từ lịch sự (hiện tại và quá khứ)',p:'Động từ dạng lịch sự kết thúc bằng <b>ます</b>. Có bốn dạng: <b>～ます</b> (thói quen hoặc tương lai), <b>～ません</b> (không), <b>～ました</b> (đã làm), <b>～ませんでした</b> (đã không làm). Trong tiếng Nhật, hiện tại và tương lai dùng chung một dạng, người nghe dựa vào từ chỉ thời gian để hiểu.',ex:[['まいあさ 6じに おきます。','Mỗi sáng tôi dậy lúc 6 giờ.'],['きのう べんきょうしました。','Hôm qua tôi đã học bài.'],['けさ はたらきませんでした。','Sáng nay tôi đã không làm việc.']]},
{t:'N(thời gian) に V: vào lúc ...',p:'Trợ từ <b>に</b> đứng sau thời điểm cụ thể (giờ, thứ, ngày tháng) để cho biết hành động xảy ra lúc nào. Các từ chỉ thời gian tương đối như <b>きょう, あした, きのう, けさ, まいあさ, まいにち</b> thì <b>không</b> thêm に.',ex:[['わたしは 6じはんに おきます。','Tôi dậy lúc 6 giờ rưỡi.'],['にちようびに やすみます。','Tôi nghỉ vào Chủ nhật.'],['まいにち べんきょうします。','Tôi học mỗi ngày.']]},
{t:'N1 から N2 まで: từ ... đến ...',p:'<b>から</b> chỉ điểm bắt đầu, <b>まで</b> chỉ điểm kết thúc, dùng cho cả giờ giấc và địa điểm. Có thể dùng riêng một trong hai. Khi đứng cuối câu hỏi hoặc trả lời thì thêm <b>です</b>.',ex:[['ぎんこうは 9じから 3じまでです。','Ngân hàng làm việc từ 9 giờ đến 3 giờ.'],['わたしは 9じから 5じまで はたらきます。','Tôi làm việc từ 9 đến 5 giờ.'],['ひるやすみは 12じから 1じまでです。','Nghỉ trưa từ 12 giờ đến 1 giờ.']]},
{t:'N1 と N2: và',p:'<b>と</b> nối hai danh từ với nghĩa "và", chỉ dùng nối danh từ, không nối câu hay động từ.',ex:[['ぎんこうと ゆうびんきょくは やすみです。','Ngân hàng và bưu điện đều nghỉ.'],['げつようびと かようびは やすみです。','Thứ Hai và thứ Ba là ngày nghỉ.']]},
{t:'Thứ trong tuần và ～ね',p:'Thứ đều kết thúc bằng <b>ようび</b>: <b>げつ, か, すい, もく, きん, ど, にち</b>. Hỏi bằng <b>なんようび</b>. Trợ từ cuối câu <b>ね</b> thể hiện sự đồng cảm hoặc nhờ người nghe xác nhận, như "nhỉ", "nhé".',ex:[['きょうは なんようびですか。','Hôm nay là thứ mấy vậy?'],['きんようびです。','Là thứ Sáu.'],['まいにち 10じまで はたらきます。','Mỗi ngày tôi làm việc đến 10 giờ.'],['たいへんですね。','Vất vả nhỉ.']]}
],
q:[
{j:'いま ＿ ですか。',h:'Bây giờ là mấy giờ vậy? (trả lời: 9 giờ 15 phút)',o:['なんじ','なんぷん','なんようび','いくら'],a:0,e:'なんじ hỏi giờ.'},
{j:'まいあさ 6じ＿ おきます。',h:'Mỗi sáng tôi dậy lúc 6 giờ.',o:['に','を','で','の'],a:0,e:'Thời điểm cụ thể (6じ) đi với に.'},

v:[

'飛行機|ひこうき|máy bay','船|ふね|tàu thủy','電車|でんしゃ|tàu điện','地下鉄|ちかてつ|tàu điện ngầm','新幹線|しんかんせん|tàu cao tốc shinkansen','バス||xe buýt','タクシー||taxi','自転車|じてんしゃ|xe đạp','歩いて|あるいて|đi bộ',
'人|ひと|người','友達|ともだち|bạn bè','彼|かれ|anh ấy, bạn trai','彼女|かのじょ|cô ấy, bạn gái','家族|かぞく|gia đình','一人で|ひとりで|một mình',

'～月|～がつ|tháng ～','何月|なんがつ|tháng mấy','1日|ついたち|ngày mùng 1','2日|ふつか|ngày mùng 2','3日|みっか|ngày mùng 3','4日|よっか|ngày mùng 4','5日|いつか|ngày mùng 5','6日|むいか|ngày mùng 6','7日|なのか|ngày mùng 7','8日|ようか|ngày mùng 8','9日|ここのか|ngày mùng 9','10日|とおか|ngày mùng 10','14日|じゅうよっか|ngày 14','20日|はつか|ngày 20','24日|にじゅうよっか|ngày 24','～日|～にち|ngày ～','何日|なんにち|ngày mấy',
'いつ||khi nào','誕生日|たんじょうび|sinh nhật','普通|ふつう|tàu thường (dừng mọi ga)','急行|きゅうこう|tàu tốc hành','特急|とっきゅう|tàu tốc hành đặc biệt','次の|つぎの|tiếp theo'
],
g:[
{t:'N(địa điểm) へ いきます / きます / かえります',p:'Ba động từ chuyển động <b>đi, đến, về</b> dùng trợ từ <b>へ</b> (viết là へ nhưng đọc là <b>e</b>) để chỉ hướng đến địa điểm. Để phủ định hoàn toàn "không đi đâu cả" dùng <b>どこ[へ]も いきません</b>.',ex:[['わたしは きょうとへ いきます。','Tôi đi Kyoto.'],['ともだちは にほんへ きました。','Bạn tôi đã đến Nhật.'],['きのうは どこへも いきませんでした。','Hôm qua tôi không đi đâu cả.']]},
{t:'N(phương tiện) で いきます',p:'Trợ từ <b>で</b> chỉ phương tiện đi lại: tàu điện, xe buýt, taxi, xe đạp... Riêng đi bộ thì nói <b>あるいて</b>, không có で. Hỏi phương tiện bằng <b>なんで</b>.',ex:[['でんしゃで かいしゃへ いきます。','Tôi đi đến công ty bằng tàu điện.'],['あるいて がっこうへ いきます。','Tôi đi bộ đến trường.'],['なんで きましたか。','Bạn đến bằng gì vậy?']]},
{t:'N(người) と いきます: đi cùng ai',p:'Trợ từ <b>と</b> sau người hoặc con vật nghĩa là "cùng với". Khi đi một mình thì dùng <b>ひとりで</b>, không dùng と.',ex:[['かぞくと にほんへ きました。','Tôi đã đến Nhật cùng gia đình.'],['ともだちと えいがへ いきます。','Tôi đi xem phim với bạn.'],['ひとりで かえります。','Tôi về một mình.']]},
{t:'いつ: khi nào',p:'<b>いつ</b> hỏi thời điểm. Khác với giờ giấc cụ thể, sau <b>いつ</b> không thêm に. Có thể trả lời bằng ngày tháng, tuần, năm.',ex:[['いつ にほんへ きましたか。','Bạn đã đến Nhật khi nào?'],['たんじょうびは いつですか。','Sinh nhật bạn là khi nào?'],['4がつ 8かです。','Là ngày 8 tháng 4.']]},
{t:'Tháng, ngày, tuần, năm',p:'Tháng: số + <b>がつ</b>; chú ý 4 <b>しがつ</b>, 7 <b>しちがつ</b>, 9 <b>くがつ</b>. Ngày mùng 1 đến 10 đọc bất quy tắc: <b>ついたち, ふつか, みっか, よっか, いつか, むいか, なのか, ようか, ここのか, とおか</b>. Ngoài ra nhớ 14 <b>じゅうよっか</b>, 20 <b>はつか</b>, 24 <b>にじゅうよっか</b>, còn lại số + <b>にち</b>. Các từ <b>せんしゅう, こんしゅう, らいしゅう, せんげつ, らいげつ, きょねん, ことし, らいねん</b> là thời gian tương đối nên không có に.',ex:[['らいしゅう にほんへ いきます。','Tuần sau tôi sẽ đi Nhật.'],['きょうは なんがつ なんにちですか。','Hôm nay là ngày mấy tháng mấy?'],['しがつ ここのかです。','Là ngày 9 tháng 4.']]},
{t:'～よ: nhấn mạnh thông tin',p:'Trợ từ cuối câu <b>よ</b> dùng khi bạn muốn người nghe biết thông tin mà họ có thể chưa biết, giống như "đấy", "nhé". Dùng với người ngang hàng hoặc cấp dưới; với người trên, nói nhẹ nhàng hơn.',ex:[['この でんしゃは おおさかへ いきますか。','Tàu này có đi Osaka không?'],['いいえ、いきません。つぎの ふつうですよ。','Không, không đi. Chuyến tàu thường kế tiếp mới đi đấy.']]}
],
q:[
{j:'わたしは がっこう＿ いきます。',h:'Tôi đi đến trường.',o:['へ','で','と','も'],a:0,e:'Hướng đến địa điểm dùng へ (đọc là e).'},
{j:'でんしゃ＿ かいしゃへ いきます。',h:'Tôi đi đến công ty bằng tàu điện.',o:['で','へ','と','を'],a:0,e:'Phương tiện dùng で.'},
{j:'ともだち＿ えいがへ いきます。',h:'Tôi đi xem phim cùng bạn.',o:['と','で','へ','が'],a:0,e:'Đi cùng người nào thì dùng と.'},
{j:'＿ がっこうへ いきます。',h:'Tôi đi bộ đến trường.',o:['あるいて','あるいてで','あるきで','あるくで'],a:0,e:'Đi bộ dùng あるいて, không thêm で.'},
{j:'きのうは どこ＿ いきませんでした。',h:'Hôm qua tôi không đi đâu cả.',o:['へも','へが','をも','にも'],a:0,e:'Phủ định hoàn toàn dùng どこ[へ]も + động từ phủ định.'},
{j:'',h:'Ngày 9 tháng 4 đọc là:',o:['しがつ ここのか','よんがつ ここのか','しがつ きゅうか','しがつ くにち'],a:0,e:'Tháng 4 là しがつ, ngày 9 là ここのか.'},
{j:'ひとり＿ かえります。',h:'Tôi về một mình.',o:['で','と','へ','に'],a:0,e:'ひとりで nghĩa là một mình.'},
{j:'',h:'らいしゅう nghĩa là:',o:['tuần sau','tuần trước','tuần này','tháng sau'],a:0,e:'らいしゅう là tuần sau.'}
]},

{n:6, t:'Ăn uống và các hoạt động',
v:[
'食べます|たべます|ăn','飲みます|のみます|uống','吸います|すいます|hút (thuốc)','見ます|みます|xem, nhìn','聞きます|ききます|nghe','読みます|よみます|đọc','書きます|かきます|viết, vẽ','買います|かいます|mua','撮ります|とります|chụp (ảnh)','します||làm','会います|あいます|gặp (bạn bè)',
'ご飯|ごはん|cơm, bữa ăn','朝ごはん|あさごはん|bữa sáng','昼ごはん|ひるごはん|bữa trưa','晩ごはん|ばんごはん|bữa tối','パン||bánh mì','卵|たまご|trứng','肉|にく|thịt','魚|さかな|cá','野菜|やさい|rau','果物|くだもの|trái cây',
'水|みず|nước','お茶|おちゃ|trà','紅茶|こうちゃ|trà đen','牛乳|ぎゅうにゅう|sữa bò','ジュース||nước ép','ビール||bia','お酒|おさけ|rượu',
'ビデオ||video','手紙|てがみ|thư','レポート||báo cáo','写真|しゃしん|ảnh','店|みせ|cửa hàng','レストラン||nhà hàng','庭|にわ|vườn','宿題|しゅくだい|bài tập về nhà','テニス||quần vợt','サッカー||bóng đá','お花見|おはなみ|ngắm hoa anh đào',
'何|なに|cái gì','一緒に|いっしょに|cùng nhau','ちょっと||một chút','いつも||luôn luôn','時々|ときどき|thỉnh thoảng','それから||sau đó, tiếp theo','ええ||vâng','いいですね||hay quá nhỉ','わかりました||tôi hiểu rồi'
],
g:[
{t:'N を V: tân ngữ của động từ',p:'Trợ từ <b>を</b> (đọc là <b>o</b>) đứng sau tân ngữ, tức đối tượng chịu tác động của hành động. Động từ như <b>たべます, のみます, みます, よみます, かきます, かいます</b> đều đi với を.',ex:[['わたしは ジュースを のみます。','Tôi uống nước ép.'],['ミラーさんは ほんを よみます。','Anh Miller đọc sách.'],['まいあさ しんぶんを みます。','Mỗi sáng tôi xem báo.']]},
{t:'N(địa điểm) で V: làm gì ở đâu',p:'Trợ từ <b>で</b> sau địa điểm cho biết hành động diễn ra ở đâu. Đừng nhầm với <b>へ</b> (chỉ hướng di chuyển) và <b>に</b> (thời điểm). Với bài này, mọi hành động "ăn, uống, mua, đọc..." xảy ra ở đâu thì dùng で.',ex:[['スーパーで パンを かいます。','Tôi mua bánh mì ở siêu thị.'],['としょかんで ほんを よみます。','Tôi đọc sách ở thư viện.'],['レストランで ひるごはんを たべます。','Tôi ăn trưa ở nhà hàng.']]},
{t:'なにを V ますか / なにも V ません',p:'Hỏi hành động bằng <b>なにを V ますか</b>. Câu trả lời phủ định hoàn toàn dùng <b>なにも + V ません</b> ("không ... gì cả"), tương tự どこへも ở bài 5.',ex:[['あした なにを しますか。','Ngày mai bạn làm gì?'],['サッカーを します。','Tôi chơi bóng đá.'],['けさ なにも たべませんでした。','Sáng nay tôi không ăn gì cả.']]},
{t:'N を します',p:'<b>します</b> kết hợp với danh từ để tạo thành nhiều hành động: chơi thể thao, tổ chức sự kiện, làm bài... Ví dụ <b>サッカーを します</b> (chơi bóng đá), <b>しゅくだいを します</b> (làm bài tập), <b>パーティーを します</b> (tổ chức tiệc).',ex:[['ともだちと テニスを します。','Tôi chơi quần vợt với bạn.'],['うちで しゅくだいを します。','Tôi làm bài tập ở nhà.'],['おはなみを しました。','Chúng tôi đã đi ngắm hoa anh đào.']]},
{t:'V ませんか / V ましょう: rủ và đồng ý',p:'<b>V ませんか</b> là lời mời lịch sự: "cùng ... nhé?". Đáp đồng ý bằng <b>ええ、V ましょう</b> (vâng, cùng làm nào). <b>V ましょう</b> cũng dùng để chủ động đề nghị, ví dụ "nghỉ một chút nào". Nếu từ chối, nói <b>すみません、ちょっと...</b> rồi nêu lý do.',ex:[['いっしょに ひるごはんを たべませんか。','Cùng ăn trưa nhé?'],['ええ、たべましょう。','Vâng, cùng ăn nào.'],['ちょっと やすみましょう。','Chúng ta nghỉ một chút nhé.']]},
{t:'Các từ hay gặp: いつも, ときどき, それから; N に あいます',p:'<b>いつも</b> là luôn luôn, <b>ときどき</b> là thỉnh thoảng, <b>それから</b> nối hai hành động liên tiếp. Với <b>あいます</b> (gặp), người được gặp đi kèm trợ từ <b>に</b>.',ex:[['いつも あさごはんを たべます。','Tôi luôn ăn sáng.'],['ときどき えいがを みます。','Thỉnh thoảng tôi xem phim.'],['あした ともだちに あいます。','Ngày mai tôi gặp bạn.']]}
],
q:[
{j:'わたしは みずを ＿。',h:'Tôi uống nước.',o:['のみます','たべます','みます','かきます'],a:0,e:'Uống nước là のみます.'},
{j:'まいあさ パン＿ たべます。',h:'Mỗi sáng tôi ăn bánh mì.',o:['を','で','に','が'],a:0,e:'Tân ngữ của động từ たべます dùng を.'},
{j:'レストラン＿ ひるごはんを たべます。',h:'Tôi ăn trưa ở nhà hàng.',o:['で','を','に','へ'],a:0,e:'Nơi diễn ra hành động dùng で.'},
{j:'いっしょに ビールを ＿。',h:'Cùng uống bia nhé? (lời mời)',o:['のみませんか','のみましょう','のみました','のみません'],a:0,e:'V ませんか là lời mời lịch sự.'},
{j:'',h:'Đáp đồng ý lời mời "いっしょに ひるごはんを たべませんか。":',o:['ええ、たべましょう。','ええ、たべました。','いいえ、たべます。','ええ、たべませんか。'],a:0,e:'Đồng ý lời mời thì dùng ええ、V ましょう.'},
{j:'なに＿ たべますか。',h:'Bạn ăn gì?',o:['を','に','で','へ'],a:0,e:'なにを V ますか hỏi tân ngữ của động từ.'},
{j:'うちで しゅくだい＿ します。',h:'Tôi làm bài tập ở nhà.',o:['を','が','に','と'],a:0,e:'N を します tạo thành hành động làm gì đó.'}
]},

{n:7, t:'Tặng, nhận và cho mượn',
v:[

'手|て|tay','箸|はし|đũa','スプーン||thìa','ナイフ||dao ăn','フォーク||nĩa','はさみ||cái kéo','ファクス||máy fax','パソコン||máy tính cá nhân','消しゴム|けしゴム|cục tẩy','紙|かみ|giấy','花|はな|hoa','シャツ||áo sơ mi','プレゼント||quà tặng','荷物|にもつ|hành lý','お金|おかね|tiền','切符|きっぷ|vé','クリスマス||Giáng sinh',
'父|ちち|bố (của mình)','母|はは|mẹ (của mình)','お父さん|おとうさん|bố (của người khác)','お母さん|おかあさん|mẹ (của người khác)',

],
g:[
{t:'N(công cụ) で V: bằng cái gì',p:'Trợ từ <b>で</b> còn chỉ công cụ, phương tiện hoặc ngôn ngữ dùng để làm hành động. Trả lời cho câu hỏi "bằng cái gì".',ex:[['はしで ごはんを たべます。','Tôi ăn cơm bằng đũa.'],['にほんごで てがみを かきます。','Tôi viết thư bằng tiếng Nhật.'],['パソコンで レポートを かきます。','Tôi viết báo cáo bằng máy tính.']]},
{t:'～は ～ごで なんですか: nói ... bằng tiếng khác',p:'Để hỏi một từ trong ngôn ngữ khác, nói <b>「từ」は ～ごで なんですか</b>. Từ được hỏi để nguyên, đặt trước は.',ex:[['ありがとうは えいごで なんですか。','Từ "ありがとう" nói bằng tiếng Anh là gì?'],['ありがとうは えいごで サンキューです。','"ありがとう" tiếng Anh là "thank you".']]},
{t:'N1(người) に N2を あげます: tặng, cho',p:'<b>あげます</b> là tặng hoặc cho ai đó. Người nhận đi với <b>に</b>, vật được tặng đi với <b>を</b>. Cùng kiểu này có <b>おしえます</b> (dạy), <b>おくります</b> (gửi), <b>かします</b> (cho mượn).',ex:[['わたしは きむらさんに はなを あげます。','Tôi tặng hoa cho cô Kimura.'],['やまださんは ミラーさんに にほんごを おしえます。','Anh Yamada dạy tiếng Nhật cho anh Miller.'],['ははに てがみを おくります。','Tôi gửi thư cho mẹ.']]},
{t:'N1(người) に N2を もらいます: nhận',p:'<b>もらいます</b> là nhận. Người cho đi với <b>に</b> (nghĩa "từ") hoặc <b>から</b>. Tương tự: <b>かります</b> (mượn), <b>ならいます</b> (học từ ai). Chú ý: với tổ chức như công ty, trường học, dùng <b>から</b>.',ex:[['わたしは ともだちに とけいを もらいました。','Tôi đã nhận được đồng hồ từ bạn.'],['ともだちに ほんを かりました。','Tôi đã mượn sách của bạn.'],['かいしゃから でんわを もらいました。','Tôi đã nhận được cuộc gọi từ công ty.']]},
{t:'もう V ました / まだです',p:'Hỏi hành động đã làm chưa bằng <b>もう V ましたか</b>. Nếu rồi, đáp <b>はい、もう V ました</b>. Nếu chưa, đáp <b>いいえ、まだです</b>, không dùng "もう V ません".',ex:[['もう ひるごはんを たべましたか。','Bạn đã ăn trưa chưa?'],['はい、もう たべました。','Vâng, tôi đã ăn rồi.'],['いいえ、まだです。','Chưa, tôi vẫn chưa ăn.']]},
{t:'Lời nói khi đến thăm nhà',p:'Đến thăm nhà ai, đứng trước cửa nói <b>ごめんください</b>. Chủ nhà đáp <b>いらっしゃい</b>, rồi mời <b>どうぞ おあがりください</b>. Khách đáp <b>しつれいします</b> và vào nhà. Trước khi ăn hoặc uống người Nhật nói <b>いただきます</b>.',ex:[['ごめんください。','Xin phép cho tôi vào ạ.'],['いらっしゃい。どうぞ おあがりください。','Chào mừng anh chị. Xin mời vào.'],['しつれいします。','Xin phép cho tôi vào.'],['いただきます。','Xin mời (nói trước khi ăn).']]}
],
q:[
{j:'わたしは はし＿ ごはんを たべます。',h:'Tôi ăn cơm bằng đũa.',o:['で','を','に','へ'],a:0,e:'Công cụ dùng để làm hành động đi với で.'},
{j:'にほんご＿ レポートを かきます。',h:'Tôi viết báo cáo bằng tiếng Nhật.',o:['で','を','に','が'],a:0,e:'Ngôn ngữ, công cụ dùng để làm hành động đi với で.'},
{j:'ミラーさんは きむらさん＿ はなを あげました。',h:'Anh Miller đã tặng hoa cho cô Kimura.',o:['に','を','で','の'],a:0,e:'Người nhận của あげます đi với に.'},
{j:'わたしは ともだち＿ プレゼントを もらいました。',h:'Tôi đã nhận được quà từ bạn.',o:['に','を','で','の'],a:0,e:'Với もらいます, người cho dùng に hoặc から. Ở đây に đúng.'},
{j:'もう ひるごはんを たべましたか。',h:'Bạn chưa ăn trưa. Trả lời đúng:',o:['いいえ、まだです。','いいえ、もう たべません。','はい、まだです。','はい、いいえ。'],a:0,e:'Chưa làm thì đáp いいえ、まだです.'},
{j:'ありがとうは えいごで ＿ ですか。',h:'Từ "ありがとう" nói bằng tiếng Anh là gì?',o:['なん','どこ','だれ','いつ'],a:0,e:'なん hỏi "cái gì".'},
{j:'',h:'Trước khi ăn người Nhật nói:',o:['いただきます','ごめんください','しつれいします','いらっしゃい'],a:0,e:'いただきます là câu nói trước khi ăn hoặc uống.'}
]},

{n:8, t:'Tính từ và miêu tả',
v:[
'ハンサム||đẹp trai (tính từ な)','きれい||đẹp, sạch (tính từ な)','静か|しずか|yên tĩnh (tính từ な)','賑やか|にぎやか|náo nhiệt (tính từ な)','有名|ゆうめい|nổi tiếng (tính từ な)','親切|しんせつ|tốt bụng (tính từ な)','元気|げんき|khỏe (tính từ な)','暇|ひま|rảnh rỗi (tính từ な)','便利|べんり|tiện lợi (tính từ な)','すてき||tuyệt vời (tính từ な)',
'大きい|おおきい|to, lớn','小さい|ちいさい|nhỏ','新しい|あたらしい|mới','古い|ふるい|cũ','いい||tốt','悪い|わるい|xấu, tệ','暑い|あつい|nóng (thời tiết)','寒い|さむい|lạnh (thời tiết)','冷たい|つめたい|lạnh (đồ vật)','難しい|むずかしい|khó','易しい|やさしい|dễ','高い|たかい|cao, đắt','安い|やすい|rẻ','低い|ひくい|thấp','面白い|おもしろい|thú vị','美味しい|おいしい|ngon','忙しい|いそがしい|bận','楽しい|たのしい|vui','白い|しろい|trắng','黒い|くろい|đen','赤い|あかい|đỏ','青い|あおい|xanh dương',
'桜|さくら|hoa anh đào','山|やま|núi','町|まち|thị trấn, phố','食べ物|たべもの|đồ ăn','車|くるま|xe hơi','所|ところ|nơi, chỗ','寮|りょう|ký túc xá','生活|せいかつ|cuộc sống','仕事|しごと|công việc',
'どう||thế nào','どんな～||～ như thế nào','どれ||cái nào','とても||rất','あまり||không ～ lắm','そして||và, hơn nữa','～が、～||～ nhưng ～','お元気ですか|おげんきですか|bạn có khỏe không?'
],
g:[
{t:'Hai loại tính từ: đuôi い và đuôi な',p:'Tiếng Nhật có hai nhóm tính từ. Nhóm <b>tính từ い</b> luôn kết thúc bằng い (<b>たかい, おおきい, おいしい</b>). Nhóm <b>tính từ な</b> không có い cuối (<b>きれい, しずか, ゆうめい</b>). Chú ý: <b>きれい</b> và <b>ゆうめい</b> tuy có âm い nhưng là tính từ な. Từ điển viết tính từ な bỏ な, ví dụ きれい.',ex:[['たかい','cao, đắt (tính từ い)'],['きれい','đẹp, sạch (tính từ な)'],['しずか','yên tĩnh (tính từ な)']]},
{t:'N は A です: miêu tả',p:'Đặt tính từ trước <b>です</b> để nói N có tính chất gì. Tính từ い giữ nguyên, tính từ な bỏ な rồi gắn です. Câu hỏi thêm か.',ex:[['さくらは きれいです。','Hoa anh đào đẹp.'],['この ほんは おもしろいです。','Quyển sách này thú vị.'],['ベトナムは あついですか。','Việt Nam nóng không?']]},
{t:'Phủ định của tính từ',p:'Tính từ な: bỏ な, thêm <b>じゃ ありません</b> (như danh từ). Tính từ い: bỏ い, thêm <b>くないです</b> (cũng có thể nói <b>くありません</b>, lịch sự hơn một chút). Ngoại lệ: <b>いい</b> đổi thành <b>よくないです</b>.',ex:[['ここは しずかじゃ ありません。','Ở đây không yên tĩnh.'],['この くるまは たかくないです。','Chiếc xe này không đắt.'],['てんきは よくないです。','Thời tiết không tốt.']]},
{t:'Tính từ bổ nghĩa danh từ',p:'Tính từ đứng trước danh từ. Tính từ い: <b>A い + N</b>. Tính từ な: <b>A な + N</b> (giữ lại <b>な</b>).',ex:[['あたらしい くるまです。','Đó là chiếc xe mới.'],['きれいな はなです。','Đó là bông hoa đẹp.'],['ふじさんは ゆうめいな やまです。','Núi Phú Sĩ là ngọn núi nổi tiếng.']]},
{t:'どんな N / どう: hỏi tính chất',p:'<b>どんな N</b> hỏi N thuộc loại nào, có tính chất gì. <b>どうですか</b> hỏi cảm nhận, ấn tượng về một việc, một nơi. Trả lời bằng tính từ.',ex:[['ふじさんは どんな やまですか。','Núi Phú Sĩ là ngọn núi như thế nào?'],['たかい やまです。','Là ngọn núi cao.'],['にほんの せいかつは どうですか。','Cuộc sống ở Nhật thế nào?']]},
{t:'とても / あまり / ～が / そして',p:'<b>とても</b> là "rất" đứng trước tính từ. <b>あまり</b> là "không ... lắm" và luôn đi với phủ định. <b>A1ですが、A2です</b>: <b>が</b> nghĩa "nhưng" nối hai vế đối lập. <b>そして</b> nối hai ý bổ sung cho nhau.',ex:[['とても おいしいです。','Rất ngon.'],['この りょうりは あまり たかくないです。','Món này không đắt lắm.'],['この みせは やすいですが、おいしくないです。','Quán này rẻ nhưng không ngon.'],['ここは しずかです。そして きれいです。','Ở đây yên tĩnh. Hơn nữa còn sạch đẹp.']]}
],
q:[
{j:'さくらは ＿ はなです。',h:'Hoa anh đào là bông hoa đẹp.',o:['きれいな','きれいい','きれいの','きれいです'],a:0,e:'Tính từ な đứng trước danh từ phải giữ な.'},
{j:'',h:'Dạng phủ định đúng của "おいしい" (ngon):',o:['おいしくないです','おいしいじゃ ないです','おいしくじゃ ありません','おいしいくないです'],a:0,e:'Tính từ い: bỏ い, thêm くないです.'},
{j:'しずか＿ へやです。',h:'Đó là căn phòng yên tĩnh.',o:['な','い','の','に'],a:0,e:'しずか là tính từ な nên gắn な trước danh từ.'},
{j:'ミラーさんは ＿ ひとですか。',h:'Anh Miller là người như thế nào?',o:['どんな','どう','なん','どこ'],a:0,e:'どんな N hỏi tính chất của N.'},
{j:'にほんの せいかつは ＿ ですか。',h:'Cuộc sống ở Nhật thế nào?',o:['どう','どんな','なに','どれ'],a:0,e:'どう hỏi cảm nhận, đứng một mình trước です.'},
{j:'この りょうりは おいしいですが、＿ です。',h:'Món này ngon nhưng đắt.',o:['たかい','たかく','たかくて','たかいの'],a:0,e:'Sau が là một câu đầy đủ nên dùng たかい + です.'},
{j:'ハノイは あまり ＿。',h:'Hà Nội không nóng lắm.',o:['あつくないです','あついです','あつくて','あつい'],a:0,e:'あまり luôn đi với phủ định.'},
{j:'',h:'Dạng phủ định của "いい" (tốt):',o:['よくないです','いくないです','いいくないです','いいじゃ ないです'],a:0,e:'いい là ngoại lệ, đổi thành よくないです.'}
]},

{n:9, t:'Sở thích và lý do',
v:[
'わかります||hiểu','あります||có (đồ vật)','好き|すき|thích (tính từ な)','嫌い|きらい|ghét (tính từ な)','上手|じょうず|giỏi (tính từ な)','下手|へた|kém (tính từ な)',
'料理|りょうり|món ăn, nấu ăn','飲み物|のみもの|đồ uống','スポーツ||thể thao','野球|やきゅう|bóng chày','ダンス||khiêu vũ','音楽|おんがく|âm nhạc','歌|うた|bài hát','クラシック||nhạc cổ điển','ジャズ||nhạc jazz','コンサート||buổi hòa nhạc','カラオケ||karaoke','歌舞伎|かぶき|kịch kabuki','絵|え|tranh','字|じ|chữ','漢字|かんじ|chữ Hán','平仮名|ひらがな|chữ Hiragana','片仮名|かたかな|chữ Katakana',
'細かいお金|こまかいおかね|tiền lẻ','チケット||vé','時間|じかん|thời gian','用事|ようじ|việc bận','約束|やくそく|cuộc hẹn, lời hứa',
'ご主人|ごしゅじん|chồng (của người khác)','主人|しゅじん|chồng (của mình)','奥さん|おくさん|vợ (của người khác)','家内|かない|vợ (của mình)','子ども|こども|con, trẻ em',
'よく||thường, rõ','だいたい||đại khái','たくさん||nhiều','少し|すこし|một chút','全然|ぜんぜん|hoàn toàn không','早く|はやく|sớm, nhanh',
'～から||vì ～ nên','どうして||tại sao','残念です|ざんねんです|tiếc quá','もしもし||alô','いっしょにいかがですか||cùng đi với tôi nhé?'
],
g:[
{t:'N が すき / きらい / じょうず / へた',p:'Với những từ chỉ sở thích hoặc khả năng, đối tượng đi với trợ từ <b>が</b>, không phải を. <b>すき</b> (thích), <b>きらい</b> (ghét), <b>じょうず</b> (giỏi), <b>へた</b> (kém) đều là tính từ な. Khi muốn nói rất thích, thêm <b>だいすき</b>.',ex:[['わたしは すしが すきです。','Tôi thích sushi.'],['ミラーさんは うたが じょうずです。','Anh Miller hát giỏi.'],['わたしは やさいが きらいです。','Tôi ghét rau.']]},
{t:'N が わかります / あります',p:'<b>わかります</b> (hiểu) và <b>あります</b> (có) cũng đi với <b>が</b>. Người có hoặc hiểu thường là chủ đề (<b>は</b>), còn thứ được hiểu hoặc được có đi với <b>が</b>.',ex:[['わたしは にほんごが わかります。','Tôi hiểu tiếng Nhật.'],['きょうは じかんが ありません。','Hôm nay tôi không có thời gian.'],['こまかい おかねが ありますか。','Bạn có tiền lẻ không?']]},
{t:'どんな N が すきですか',p:'Dùng <b>どんな N</b> để hỏi thể loại. Trả lời bằng tên cụ thể của thể loại đó.',ex:[['どんな スポーツが すきですか。','Bạn thích môn thể thao nào?'],['サッカーが すきです。','Tôi thích bóng đá.'],['どんな おんがくが すきですか。','Bạn thích loại nhạc nào?']]},
{t:'Mức độ: よく, だいたい, たくさん, すこし, あまり, ぜんぜん',p:'<b>よく</b> (tốt, rõ), <b>だいたい</b> (đại khái), <b>たくさん</b> (nhiều), <b>すこし</b> (một chút) dùng với câu khẳng định. <b>あまり</b> (không ... lắm) và <b>ぜんぜん</b> (hoàn toàn không) chỉ dùng với phủ định. Các từ này đứng trước động từ hoặc tính từ.',ex:[['にほんごが よく わかります。','Tôi hiểu tiếng Nhật khá rõ.'],['にほんごが すこし わかります。','Tôi hiểu một chút tiếng Nhật.'],['にほんごが あまり わかりません。','Tôi không hiểu tiếng Nhật lắm.'],['にほんごが ぜんぜん わかりません。','Tôi hoàn toàn không hiểu tiếng Nhật.']]},
{t:'～から: vì ～ nên',p:'Đặt <b>から</b> sau vế nêu lý do. Vế còn lại là kết quả. Thứ tự giống tiếng Việt "vì A nên B" nhưng viết A から、B (lý do trước, kết quả sau).',ex:[['じかんが ありませんから、いきません。','Vì không có thời gian nên tôi không đi.'],['あしたは やすみですから、うちに います。','Vì mai được nghỉ nên tôi ở nhà.']]},
{t:'どうして: hỏi lý do, và mời hoặc từ chối',p:'<b>どうして</b> hỏi lý do, trả lời kết thúc bằng <b>～から</b>. Khi mời bằng <b>いっしょに いかがですか</b> mà không thể nhận lời, từ chối nhẹ nhàng bằng <b>ざんねんですが、ちょっと...</b> và nêu lý do.',ex:[['どうして きのう きませんでしたか。','Tại sao hôm qua bạn không đến?'],['ようじが ありましたから。','Vì tôi có việc bận.'],['ざんねんですが、きょうは ちょっと...','Tiếc quá, hôm nay thì hơi khó...']]}
],
q:[
{j:'わたしは にほんご＿ わかります。',h:'Tôi hiểu tiếng Nhật.',o:['が','を','に','で'],a:0,e:'わかります đi với が.'},
{j:'わたしは りょうり＿ すきです。',h:'Tôi thích nấu ăn.',o:['が','を','に','で'],a:0,e:'すき đi với が.'},
{j:'ミラーさんは ピアノ＿ じょうずです。',h:'Anh Miller chơi piano giỏi.',o:['が','を','に','で'],a:0,e:'じょうず đi với が.'},
{j:'わたしは あまり おさけを ＿。',h:'Tôi không uống rượu lắm.',o:['のみません','のみます','のみましょう','のみませんか'],a:0,e:'あまり luôn đi với phủ định.'},
{j:'',h:'"ぜんぜん" có nghĩa là:',o:['hoàn toàn không (đi với phủ định)','rất (đi với khẳng định)','thường xuyên','hơi hơi'],a:0,e:'ぜんぜん đi với phủ định: ぜんぜん わかりません.'},
{j:'',h:'Từ dùng để hỏi lý do là:',o:['どうして','どこ','いつ','だれ'],a:0,e:'どうして hỏi "tại sao".'},
{j:'どうして おさけを のみませんか。',h:'Câu trả lời đúng: "Vì tôi không thích rượu."',o:['すきじゃ ありませんから。','すきじゃ ありませんどうして。','すきじゃ ありませんで。','すきじゃ ありませんと。'],a:0,e:'Trả lời lý do bằng ～から ở cuối.'},
{j:'',h:'Từ chối lời mời khéo léo, ta nói:',o:['ざんねんですが、ちょっと...','わかりました。','ええ、いきましょう。','どうして ですか。'],a:0,e:'ざんねんですが、ちょっと... là cách từ chối mềm mỏng.'}
]},

{n:10, t:'Vị trí và sự tồn tại',
v:[
'います||có, ở (người, động vật)','あります||có, ở (đồ vật)','いろいろ||nhiều loại, đa dạng','男の人|おとこのひと|người đàn ông','女の人|おんなのひと|người phụ nữ','男の子|おとこのこ|bé trai','女の子|おんなのこ|bé gái','犬|いぬ|con chó','猫|ねこ|con mèo','木|き|cây','物|もの|đồ vật','電池|でんち|pin','箱|はこ|cái hộp','冷蔵庫|れいぞうこ|tủ lạnh','テーブル||bàn ăn','ベッド||giường','棚|たな|giá, kệ','ドア||cửa ra vào','窓|まど|cửa sổ','ポスト||hòm thư','ビル||tòa nhà','公園|こうえん|công viên','喫茶店|きっさてん|quán cà phê','本屋|ほんや|hiệu sách','～屋|～や|cửa hàng ～','乗り場|のりば|bến xe, bến tàu','県|けん|tỉnh',
'上|うえ|trên','下|した|dưới','前|まえ|trước','後ろ|うしろ|sau','右|みぎ|bên phải','左|ひだり|bên trái','中|なか|trong','外|そと|ngoài','隣|となり|bên cạnh','近く|ちかく|gần','間|あいだ|giữa',
'～や～||～ và ～ (liệt kê không đầy đủ)','どうもすみません||xin lỗi nhiều','何もありません|なにもありません|chẳng có gì cả','だれも||không ai'
],
g:[
{t:'あります và います',p:'Tiếng Nhật có hai động từ "có, ở". <b>います</b> dùng cho người và động vật (những gì tự di chuyển). <b>あります</b> dùng cho đồ vật, cây cối, tòa nhà, sự kiện (những gì không tự di chuyển).',ex:[['つくえの うえに ほんが あります。','Trên bàn có quyển sách.'],['にわに ねこが います。','Trong vườn có con mèo.'],['こうえんに おとこの こが います。','Trong công viên có bé trai.']]},
{t:'N1(địa điểm) に N2が あります / います: ở N1 có N2',p:'Dùng để nói ở một nơi có cái gì hoặc ai. Địa điểm đi với <b>に</b>, vật hoặc người tồn tại đi với <b>が</b>. Hỏi: <b>なにが ありますか</b> (có cái gì) và <b>だれが いますか</b> (có ai).',ex:[['へやに つくえが あります。','Trong phòng có cái bàn.'],['なにが ありますか。','Có cái gì vậy?'],['だれが いますか。','Có ai ở đó vậy?']]},
{t:'N2 は N1に あります / います: N2 ở N1',p:'Khi người nói đã biết N2 và muốn nói nó ở đâu, N2 trở thành chủ đề (<b>は</b>), địa điểm đi với <b>に</b>. Hỏi: <b>N2は どこに ありますか</b>.',ex:[['ミラーさんは じむしょに います。','Anh Miller ở văn phòng.'],['ポストは えきの まえに あります。','Hòm thư ở trước ga.'],['トイレは どこに ありますか。','Nhà vệ sinh ở đâu vậy?']]},
{t:'Từ chỉ vị trí: うえ, した, まえ, うしろ...',p:'Các từ <b>うえ, した, まえ, うしろ, みぎ, ひだり, なか, そと, となり, ちかく, あいだ</b> đứng sau danh từ qua <b>の</b>: <b>N の うえ</b>. Với "ở giữa A và B" dùng <b>AとBの あいだ</b>.',ex:[['つくえの うえに ほんが あります。','Trên bàn có sách.'],['ぎんこうの となりに ゆうびんきょくが あります。','Bên cạnh ngân hàng có bưu điện.'],['ほんやと ぎんこうの あいだに ポストが あります。','Giữa hiệu sách và ngân hàng có hòm thư.']]},
{t:'N1や N2: liệt kê chưa đầy đủ',p:'<b>と</b> liệt kê đầy đủ mọi thứ. <b>や</b> liệt kê một vài thứ làm ví dụ, ngụ ý còn thứ khác nữa. Trong tiếng Việt gần với "A, B, vân vân".',ex:[['はこの なかに てがみや しゃしんが あります。','Trong hộp có thư, ảnh, v.v.'],['つくえの うえに ほんや ノートが あります。','Trên bàn có sách, vở, v.v.']]},
{t:'Phủ định: ありません, いません',p:'Phủ định là <b>ありません</b> và <b>いません</b>. Để nói "không có gì cả" dùng <b>なにも ありません</b>, "không có ai" dùng <b>だれも いません</b>.',ex:[['へやに テレビは ありません。','Trong phòng không có ti vi.'],['へやに なにも ありません。','Trong phòng chẳng có gì cả.'],['こうえんに だれも いません。','Trong công viên không có ai.']]}
],
q:[
{j:'つくえの うえに ほんが ＿。',h:'Trên bàn có sách.',o:['あります','います','ありません','いません'],a:0,e:'Sách là đồ vật nên dùng あります.'},
{j:'にわに ねこが ＿。',h:'Trong vườn có con mèo.',o:['います','あります','ありません','いません'],a:0,e:'Mèo là động vật nên dùng います.'},
{j:'ミラーさんは じむしょ＿ います。',h:'Anh Miller ở văn phòng.',o:['に','を','で','へ'],a:0,e:'Nơi tồn tại đi với に.'},
{j:'れいぞうこの ＿ に ビールが あります。',h:'Trong tủ lạnh có bia.',o:['なか','うえ','そと','となり'],a:0,e:'なか là bên trong.'},
{j:'ポストは ぎんこうの となり＿ あります。',h:'Hòm thư ở bên cạnh ngân hàng.',o:['に','を','で','と'],a:0,e:'Vị trí tồn tại đi với に.'},
{j:'こうえんに だれが いますか。',h:'Câu trả lời đúng:',o:['おとこの こが います。','おとこの こが あります。','おとこの こです あります。','おとこの こを います。'],a:0,e:'Người dùng います, vị trí tồn tại đi với が.'},
{j:'つくえの うえに ほん＿ ノートが あります。',h:'Trên bàn có sách, vở, vân vân (liệt kê chưa đủ).',o:['や','と','の','に'],a:0,e:'や dùng để liệt kê chưa đầy đủ, ngụ ý còn nữa.'},
{j:'',h:'Từ trái nghĩa với うえ (trên) là:',o:['した','まえ','となり','なか'],a:0,e:'うえ (trên) đối lập với した (dưới).'}
]},

{n:11, t:'Đếm số lượng và khoảng thời gian',
v:[
'います||có (con cái, người thân)','掛かります|かかります|mất (thời gian, tiền)',
'一つ|ひとつ|một cái','二つ|ふたつ|hai cái','三つ|みっつ|ba cái','四つ|よっつ|bốn cái','五つ|いつつ|năm cái','六つ|むっつ|sáu cái','七つ|ななつ|bảy cái','八つ|やっつ|tám cái','九つ|ここのつ|chín cái','十|とお|mười cái',
'一人|ひとり|một người','二人|ふたり|hai người','～人|～にん|～người (từ 3 người trở lên)','～台|～だい|～chiếc (máy móc, xe)','～枚|～まい|～tờ (vật mỏng)','～回|～かい|～lần',
'りんご||quả táo','みかん||quả quýt','サンドイッチ||bánh mì kẹp','カレー||món cà ri','アイスクリーム||kem','切手|きって|tem','はがき||bưu thiếp','封筒|ふうとう|phong bì','速達|そくたつ|chuyển phát nhanh','書留|かきとめ|thư bảo đảm','航空便|こうくうびん|gửi đường hàng không','船便|ふなびん|gửi đường biển',
'両親|りょうしん|bố mẹ','兄弟|きょうだい|anh chị em','兄|あに|anh trai (của mình)','姉|あね|chị gái (của mình)','弟|おとうと|em trai (của mình)','妹|いもうと|em gái (của mình)','外国|がいこく|nước ngoài',
'～時間|～じかん|～tiếng (khoảng thời gian)','～週間|～しゅうかん|～tuần','～か月|～かげつ|～tháng','～年|～ねん|～năm','～ぐらい||khoảng ～','どのくらい||bao lâu, bao nhiêu','全部で|ぜんぶで|tổng cộng','みんな||mọi người','～だけ||chỉ ～',
'いらっしゃいませ||kính chào quý khách','いい天気ですね|いいてんきですね|trời đẹp nhỉ','お出かけですか|おでかけですか|bạn ra ngoài à?','ちょっと～まで||tôi đi ～ một chút','行ってまいります|いってまいります|tôi đi đây','行っていらっしゃい|いっていらっしゃい|anh đi nhé'
],
g:[
{t:'Đếm vật: ひとつ, ふたつ... とお',p:'Có một dãy số đếm riêng cho vật nói chung: <b>ひとつ, ふたつ, みっつ, よっつ, いつつ, むっつ, ななつ, やっつ, ここのつ, とお</b>. Từ 11 trở đi dùng số bình thường (<b>じゅういち</b>). Khi đếm, đặt số lượng ngay trước động từ, <b>không có trợ từ</b>.',ex:[['りんごを みっつ かいました。','Tôi đã mua ba quả táo.'],['みかんを いつつ ください。','Cho tôi năm quả quýt.'],['ジュースを ひとつ ください。','Cho tôi một chai nước ép.']]},
{t:'Đếm người, máy móc, vật mỏng, số lần',p:'Người: <b>ひとり, ふたり</b>, từ ba trở đi <b>số + にん</b> (<b>さんにん, よにん</b>). Máy móc, xe: <b>số + だい</b>. Vật mỏng như giấy, tem, vé: <b>số + まい</b>. Số lần: <b>số + かい</b>. Hỏi số lượng bằng <b>いくつ</b> (vật), <b>なんにん</b>, <b>なんだい</b>, <b>なんまい</b>, <b>なんかい</b>.',ex:[['こどもが ふたり います。','Tôi có hai đứa con.'],['わたしの かぞくは よにんです。','Gia đình tôi có bốn người.'],['はがきを ごまい ください。','Cho tôi năm tấm bưu thiếp.'],['くるまが にだい あります。','Có hai chiếc xe hơi.']]},
{t:'Khoảng thời gian: ～じかん, ～しゅうかん, ～かげつ, ～ねん',p:'Khoảng thời gian dùng <b>số + じかん</b> (giờ), <b>しゅうかん</b> (tuần), <b>かげつ</b> (tháng), <b>ねん</b> (năm). Biến âm cần nhớ: <b>いっしゅうかん, はっしゅうかん, いっかげつ, ろっかげつ, はっかげつ</b>. 7 giờ đồng hồ là <b>ななじかん</b>. Hỏi bằng <b>どのくらい</b>, kết hợp với <b>かかります</b> (mất).',ex:[['ここから えきまで どのくらい かかりますか。','Từ đây đến ga mất bao lâu?'],['あるいて 10ぷんぐらい かかります。','Đi bộ mất khoảng 10 phút.'],['にほんまで ひこうきで 5じかん かかります。','Đến Nhật bằng máy bay mất 5 tiếng.']]},
{t:'～ぐらい: khoảng',p:'<b>ぐらい</b> đứng sau số lượng hoặc khoảng thời gian, nghĩa là "khoảng". Đừng nhầm với <b>ごろ</b> (bài 13) dùng cho mốc thời gian.',ex:[['かぞくは 5にんぐらいです。','Gia đình có khoảng 5 người.'],['1しゅうかんぐらい やすみます。','Tôi nghỉ khoảng một tuần.']]},
{t:'～に ～かい: tần suất',p:'<b>Khoảng thời gian + に + số lần</b> diễn đạt tần suất: một tuần mấy lần, một tháng mấy lần.',ex:[['1しゅうかんに 2かい テニスを します。','Một tuần tôi chơi quần vợt hai lần.'],['1かげつに 1かい えいがを みます。','Một tháng tôi xem phim một lần.']]},
{t:'～だけ: chỉ',p:'<b>だけ</b> đặt sau danh từ hoặc số lượng, nghĩa là "chỉ". Câu vẫn dùng động từ khẳng định.',ex:[['わたしは にほんごだけ はなします。','Tôi chỉ nói tiếng Nhật.'],['りんごを ひとつだけ かいました。','Tôi chỉ mua một quả táo.'],['みんなで ごにんです。ぜんぶで 800えんです。','Tất cả là 5 người. Tổng cộng 800 yên.']]}
],
q:[
{j:'りんごを ＿ かいました。',h:'Tôi đã mua ba quả táo.',o:['みっつ','みっつを','みっつの','みつ'],a:0,e:'Số lượng đứng trực tiếp trước động từ, không có trợ từ.'},
{j:'こどもが ＿ います。',h:'Tôi có hai đứa con.',o:['ふたり','ににん','ふたつ','にり'],a:0,e:'Hai người là ふたり, ngoại lệ không phải ににん.'},
{j:'うちから えきまで あるいて 10ぷん＿ かかります。',h:'Từ nhà đến ga đi bộ mất khoảng 10 phút.',o:['ぐらい','から','まで','だけ'],a:0,e:'ぐらい nghĩa là khoảng.'},
{j:'ここから えきまで ＿ かかりますか。',h:'Từ đây đến ga mất bao lâu?',o:['どのくらい','いくら','なんじ','どこ'],a:0,e:'どのくらい hỏi khoảng thời gian hoặc số lượng.'},
{j:'1しゅうかん＿ 2かい テニスを します。',h:'Một tuần tôi chơi quần vợt hai lần.',o:['に','を','で','は'],a:0,e:'Khoảng thời gian + に + số lần diễn đạt tần suất.'},
{j:'はがきを 5＿ ください。',h:'Cho tôi 5 tấm bưu thiếp.',o:['まい','だい','かい','にん'],a:0,e:'Vật mỏng như bưu thiếp, tem, giấy đếm bằng まい.'},
{j:'わたしは にほんご＿ はなします。',h:'Tôi chỉ nói tiếng Nhật.',o:['だけ','から','まで','ぐらい'],a:0,e:'だけ nghĩa là chỉ.'}
]},

{n:12, t:'Quá khứ và so sánh',
v:[
'簡単|かんたん|đơn giản (tính từ な)','近い|ちかい|gần','遠い|とおい|xa','速い|はやい|nhanh','遅い|おそい|chậm, muộn','多い|おおい|nhiều','少ない|すくない|ít','暖かい|あたたかい|ấm','涼しい|すずしい|mát','甘い|あまい|ngọt','辛い|からい|cay','重い|おもい|nặng','軽い|かるい|nhẹ',
'季節|きせつ|mùa','春|はる|mùa xuân','夏|なつ|mùa hè','秋|あき|mùa thu','冬|ふゆ|mùa đông','天気|てんき|thời tiết','雨|あめ|mưa','雪|ゆき|tuyết','曇り|くもり|trời nhiều mây',
'ホテル||khách sạn','空港|くうこう|sân bay','海|うみ|biển','世界|せかい|thế giới','パーティー||bữa tiệc','お祭り|おまつり|lễ hội','すき焼き|すきやき|món sukiyaki','刺身|さしみ|sashimi','お寿司|おすし|sushi','天ぷら|てんぷら|tempura','生け花|いけばな|nghệ thuật cắm hoa','紅葉|もみじ|lá đỏ mùa thu',
'どちら||cái nào, bên nào (so sánh hai)','どちらも||cả hai','一番|いちばん|nhất','ずっと||hơn nhiều','初めて|はじめて|lần đầu tiên','でも||nhưng, tuy nhiên','ただいま||tôi về rồi','お帰りなさい|おかえりなさい|anh về rồi à','すごいですね||giỏi quá nhỉ','疲れました|つかれました|tôi mệt rồi'
],
g:[
{t:'Quá khứ của danh từ và tính từ な',p:'Khẳng định quá khứ: <b>でした</b>. Phủ định quá khứ: <b>じゃ ありませんでした</b>. Cấu trúc này dùng cho cả danh từ và tính từ な.',ex:[['きのうは あめでした。','Hôm qua trời mưa.'],['きのうは ひまでした。','Hôm qua tôi rảnh.'],['きのうは ひまじゃ ありませんでした。','Hôm qua tôi không rảnh.']]},
{t:'Quá khứ của tính từ い',p:'Khẳng định: bỏ <b>い</b>, thêm <b>かったです</b>. Phủ định: bỏ <b>い</b>, thêm <b>くなかったです</b>. <b>いい</b> đổi thành <b>よかったです</b> và <b>よくなかったです</b>.',ex:[['きのうの パーティーは たのしかったです。','Bữa tiệc hôm qua đã rất vui.'],['てんきは よくなかったです。','Thời tiết hôm đó không tốt.'],['この ほんは おもしろくなかったです。','Quyển sách này đã không thú vị.']]},
{t:'A は B より adj です: so sánh hơn',p:'<b>A は B より ～です</b> nghĩa là A ～ hơn B. Trợ từ <b>より</b> đứng sau vật làm chuẩn để so sánh. Thêm <b>ずっと</b> khi muốn nói hơn nhiều.',ex:[['この くるまは あの くるまより たかいです。','Chiếc xe này đắt hơn chiếc kia.'],['とうきょうは おおさかより おおきいです。','Tokyo lớn hơn Osaka.'],['ふじさんは ここの やまより ずっと たかいです。','Núi Phú Sĩ cao hơn nhiều so với ngọn núi ở đây.']]},
{t:'A と B と どちらが ～ですか: chọn trong hai',p:'Để hỏi chọn một trong hai, dùng <b>A と B と どちらが ～ですか</b>. Trả lời <b>A/B の ほうが ～です</b>. Nếu cả hai như nhau, đáp <b>どちらも ～です</b>.',ex:[['サッカーと やきゅうと どちらが おもしろいですか。','Bóng đá và bóng chày, môn nào thú vị hơn?'],['サッカーの ほうが おもしろいです。','Bóng đá thú vị hơn.'],['どちらも おもしろいです。','Cả hai đều thú vị.']]},
{t:'N[の なか]で なに/どこ/だれ/いつ が いちばん ～ですか',p:'So sánh nhất trong ba thứ trở lên. <b>いちばん</b> nghĩa là nhất. Phạm vi so sánh đi với <b>で</b>. Tùy ngữ cảnh, dùng từ để hỏi <b>なに</b> (cái gì), <b>どこ</b> (nơi nào), <b>だれ</b> (ai), <b>いつ</b> (khi nào).',ex:[['にほんで どこが いちばん きれいですか。','Ở Nhật nơi nào đẹp nhất?'],['きょうとが いちばん きれいです。','Kyoto đẹp nhất.'],['いちねんで いつが いちばん さむいですか。','Trong một năm lúc nào lạnh nhất?'],['ふゆが いちばん さむいです。','Mùa đông lạnh nhất.']]},
{t:'Mẫu hội thoại hay dùng',p:'Khi về nhà, nói <b>ただいま</b>, người trong nhà đáp <b>おかえりなさい</b>. <b>でも</b> mở đầu câu có ý trái ngược. <b>はじめて</b> nghĩa là lần đầu tiên.',ex:[['ただいま。','Tôi về rồi.'],['おかえりなさい。','Anh về rồi à.'],['きょうとは はじめてです。','Tôi đến Kyoto lần đầu.']]}
],
q:[
{j:'きのうは あめ＿。',h:'Hôm qua trời mưa.',o:['でした','です','ました','じゃ ありません'],a:0,e:'Danh từ ở quá khứ khẳng định là でした.'},
{j:'きのうの パーティーは たのしかった＿。',h:'Bữa tiệc hôm qua rất vui.',o:['です','でした','ます','だ'],a:0,e:'Tính từ い ở quá khứ: かった + です.'},
{j:'こうえんは しずか＿ ありませんでした。',h:'Công viên không yên tĩnh.',o:['じゃ','く','に','の'],a:0,e:'Tính từ な ở quá khứ phủ định: じゃ ありませんでした.'},
{j:'この くるまは あの くるま＿ たかいです。',h:'Xe này đắt hơn xe kia.',o:['より','から','まで','ほど'],a:0,e:'より là trợ từ so sánh, đứng sau vật làm chuẩn.'},
{j:'サッカーと やきゅうと ＿ が おもしろいですか。',h:'Bóng đá và bóng chày, môn nào thú vị hơn?',o:['どちら','どこ','なに','だれ'],a:0,e:'So sánh hai thứ dùng どちら.'},
{j:'にほんで ＿ が いちばん きれいですか。',h:'Ở Nhật nơi nào đẹp nhất?',o:['どこ','どちら','なに','いつ'],a:0,e:'Hỏi nơi chốn trong phạm vi lớn dùng どこ.'},
{j:'',h:'Dạng quá khứ phủ định đúng của "おいしい" là:',o:['おいしくなかったです','おいしいじゃ ありませんでした','おいしくないでした','おいしかったじゃ ありません'],a:0,e:'Tính từ い: bỏ い, thêm くなかったです.'},
{j:'',h:'"よかったです" là quá khứ của tính từ nào?',o:['いい','わるい','すき','よる'],a:0,e:'いい đổi thành よかったです ở quá khứ.'}
]},

{n:13, t:'Mong muốn và mục đích',
v:[
'遊びます|あそびます|chơi','泳ぎます|およぎます|bơi','迎えます|むかえます|đón','疲れます|つかれます|mệt','出します|だします|gửi, nộp','入ります|はいります|vào (quán cà phê)','出ます|でます|ra khỏi (quán cà phê)','結婚します|けっこんします|kết hôn','買い物します|かいものします|mua sắm','食事します|しょくじします|dùng bữa','散歩します|さんぽします|đi dạo (công viên)',
'大変|たいへん|vất vả (tính từ な)','欲しい|ほしい|muốn có','寂しい|さびしい|cô đơn','広い|ひろい|rộng','狭い|せまい|hẹp',
'市役所|しやくしょ|ủy ban thành phố','プール||hồ bơi','川|かわ|sông','経済|けいざい|kinh tế','美術|びじゅつ|mỹ thuật','釣り|つり|câu cá','スキー||trượt tuyết','登録|とうろく|đăng ký','週末|しゅうまつ|cuối tuần','買い物|かいもの|việc mua sắm',
'～ごろ||khoảng (mốc thời gian)','何か|なにか|cái gì đó','どこか||đâu đó',
'おなかがすきました||tôi đói bụng','おなかがいっぱいです||tôi no bụng','のどがかわきました||tôi khát nước','そうですね||ừ nhỉ','そうしましょう||làm như vậy nhé',
'ご注文は|ごちゅうもんは|quý khách gọi món gì ạ?','定食|ていしょく|suất ăn','牛どん|ぎゅうどん|cơm thịt bò','少々お待ちください|しょうしょうおまちください|xin quý khách đợi một chút','別々に|べつべつに|tách riêng ra'
],
g:[
{t:'N が ほしいです: muốn có N',p:'<b>ほしい</b> là tính từ い, nghĩa là muốn có một vật. Vật muốn có đi với <b>が</b>. Phủ định là <b>ほしくないです</b>. Chỉ dùng cho cảm xúc của chính người nói, hoặc hỏi người nghe.',ex:[['わたしは くるまが ほしいです。','Tôi muốn có chiếc xe hơi.'],['いま なにが いちばん ほしいですか。','Bây giờ bạn muốn có gì nhất?'],['わたしは ペットが ほしくないです。','Tôi không muốn có thú cưng.']]},
{t:'V たいです: muốn làm',p:'Bỏ <b>ます</b> ở động từ rồi thêm <b>たいです</b>: <b>いきます → いきたいです</b>. Tân ngữ có thể dùng <b>を</b> hoặc <b>が</b>. Phủ định: <b>たくないです</b>. Giống ほしい, mẫu này nói về mong muốn của người nói.',ex:[['わたしは にほんへ いきたいです。','Tôi muốn đi Nhật.'],['おすしを たべたいです。','Tôi muốn ăn sushi.'],['きょうは なにも したくないです。','Hôm nay tôi không muốn làm gì cả.']]},
{t:'N(địa điểm) へ N/V に いきます: đi để làm gì',p:'Mục đích của di chuyển đi với <b>に</b>. Có hai cách. Danh từ chỉ hành động: <b>かいもの, さんぽ, しょくじ + に</b>. Động từ: bỏ <b>ます</b> rồi thêm <b>に</b>: <b>みに いきます</b>. Động từ chuyển động là <b>いきます, きます, かえります</b>.',ex:[['デパートへ かいものに いきます。','Tôi đi đến cửa hàng bách hóa để mua sắm.'],['こうえんへ さんぽに いきます。','Tôi đi công viên để đi dạo.'],['にほんへ にほんごを べんきょうしに きました。','Tôi đến Nhật để học tiếng Nhật.']]},
{t:'Gọi món ở quán ăn',p:'Nhân viên hỏi <b>ごちゅうもんは</b>. Khách gọi món bằng <b>món + を + số lượng + ください</b>. Nhân viên đáp <b>しょうしょう おまちください</b>. Khi muốn tính tiền riêng từng người nói <b>べつべつに おねがいします</b>.',ex:[['ごちゅうもんは。','Quý khách gọi món gì ạ?'],['ぎゅうどんを ふたつ ください。','Cho tôi hai bát cơm thịt bò.'],['しょうしょう おまちください。','Xin quý khách chờ một chút.']]},
{t:'なにか / どこか: cái gì đó, đâu đó',p:'<b>なにか</b> (cái gì đó) và <b>どこか</b> (đâu đó) dùng khi đề xuất mà không nói rõ cụ thể. Khác với <b>なにも</b> và <b>どこへも</b> (phủ định hoàn toàn).',ex:[['のどが かわきましたから、なにか のみませんか。','Vì khát nước, mình uống gì đó nhé?'],['なつやすみに どこか いきたいです。','Kỳ nghỉ hè tôi muốn đi đâu đó.']]},
{t:'～ごろ: khoảng (mốc thời gian)',p:'<b>ごろ</b> đứng sau mốc thời gian như giờ giấc, ngày tháng: "khoảng ...". <b>ぐらい</b> (bài 11) dành cho khoảng thời gian dài bao lâu. So sánh: <b>3じごろ</b> (khoảng 3 giờ), <b>3じかんぐらい</b> (khoảng 3 tiếng).',ex:[['まいにち 11じごろ ねます。','Mỗi ngày tôi ngủ khoảng 11 giờ.'],['あした 3じごろ あいましょう。','Ngày mai gặp nhau khoảng 3 giờ nhé.']]}
],
q:[
{j:'わたしは くるま＿ ほしいです。',h:'Tôi muốn có xe hơi.',o:['が','を','に','で'],a:0,e:'Vật muốn có đi với が.'},
{j:'わたしは にほんへ いき＿。',h:'Tôi muốn đi Nhật.',o:['たいです','たです','ますです','たがります'],a:0,e:'Bỏ ます rồi thêm たいです.'},
{j:'おすしを たべ＿。',h:'Tôi không muốn ăn sushi.',o:['たくないです','たいじゃ ありません','なくたいです','たくありたいです'],a:0,e:'Phủ định của たいです là たくないです.'},
{j:'デパートへ かいもの＿ いきます。',h:'Tôi đến cửa hàng bách hóa để mua sắm.',o:['に','を','で','が'],a:0,e:'Mục đích của di chuyển đi với に.'},
{j:'のどが かわきましたから、＿ のみませんか。',h:'Khát nước rồi, mình uống gì đó nhé?',o:['なにか','なにも','なにを','なに'],a:0,e:'なにか là một thứ gì đó chưa xác định.'},
{j:'まいにち 11じ＿ ねます。',h:'Mỗi ngày tôi ngủ khoảng 11 giờ.',o:['ごろ','ぐらい','まで','だけ'],a:0,e:'Mốc thời gian dùng ごろ, khoảng thời gian dùng ぐらい.'},
{j:'',h:'Cách gọi món đúng: "Cho tôi hai suất ăn."',o:['ていしょくを ふたつ ください。','ていしょくを ふたつです。','ていしょくに ふたつ ください。','ていしょくが ふたり ください。'],a:0,e:'Món ăn + を + số lượng + ください.'},
{j:'',h:'Dạng muốn làm của "のみます" (uống):',o:['のみたい','のむたい','のみまたい','のめたい'],a:0,e:'Bỏ ます rồi thêm たい.'}
]},

{n:14, t:'Thể て và nhờ vả',
v:[
'つけます||bật (điện, máy lạnh)','消します|けします|tắt','開けます|あけます|mở','閉めます|しめます|đóng','急ぎます|いそぎます|vội','待ちます|まちます|đợi','止めます|とめます|dừng, đỗ','曲がります|まがります|rẽ','持ちます|もちます|mang, cầm','取ります|とります|lấy','手伝います|てつだいます|giúp đỡ','呼びます|よびます|gọi','話します|はなします|nói chuyện','見せます|みせます|cho xem','教えます|おしえます|cho biết (địa chỉ...)','座ります|すわります|ngồi','立ちます|たちます|đứng','使います|つかいます|dùng','置きます|おきます|đặt','降ります|ふります|rơi (mưa, tuyết)','コピーします||photocopy',
'エアコン||máy lạnh','パスポート||hộ chiếu','名前|なまえ|tên','住所|じゅうしょ|địa chỉ','地図|ちず|bản đồ','塩|しお|muối','砂糖|さとう|đường','問題|もんだい|bài tập, vấn đề','答え|こたえ|đáp án','読み方|よみかた|cách đọc','～方|～かた|cách ～',
'信号|しんごう|đèn giao thông','角|かど|góc đường','橋|はし|cây cầu','交差点|こうさてん|ngã tư','お釣り|おつり|tiền thừa',
'まっすぐ||thẳng','ゆっくり||chậm rãi','すぐ||ngay lập tức','また||lần nữa','後で|あとで|sau đó','もう少し|もうすこし|thêm một chút nữa','いいですよ||được thôi','さあ||nào, thôi nào','あれ？||ơ kìa'
],
g:[
{t:'Ba nhóm động từ',p:'Muốn chia thể て phải biết động từ thuộc nhóm nào. <b>Nhóm I</b>: âm trước <b>ます</b> thuộc cột い (かきます, のみます, かいます, いきます, ききます, まちます, はなします). <b>Nhóm II</b>: âm trước <b>ます</b> thuộc cột え (たべます, ねます, あけます), cộng một số động từ cột い như みます, おきます, います. <b>Nhóm III</b>: <b>します, きます</b> và danh từ + します (べんきょうします).',ex:[['かきます','Nhóm I'],['たべます','Nhóm II'],['します','Nhóm III']]},
{t:'Cách chia thể て',p:'<b>Nhóm I</b> theo âm cuối trước ます: <b>い, ち, り → って</b> (かいます → かって); <b>み, び, に → んで</b> (のみます → のんで); <b>き → いて</b> (かきます → かいて), riêng <b>いきます → いって</b>; <b>ぎ → いで</b> (いそぎます → いそいで); <b>し → して</b> (はなします → はなして). <b>Nhóm II</b>: bỏ ます, thêm て (たべて). <b>Nhóm III</b>: <b>して, きて</b>.',ex:[['かって','mua (かいます)'],['のんで','uống (のみます)'],['かいて','viết (かきます)'],['はなして','nói chuyện (はなします)'],['たべて','ăn (たべます)']]},
{t:'V てください: xin hãy ...',p:'<b>Thể て + ください</b> là cách yêu cầu hoặc nhờ lịch sự. Dùng với người ngang hàng hoặc cấp dưới. Với người trên, nên thêm lời xin lỗi mở đầu.',ex:[['ここに なまえを かいて ください。','Xin hãy viết tên vào đây.'],['ちょっと まって ください。','Xin hãy đợi một chút.'],['しおを とって ください。','Xin hãy lấy giúp tôi muối.']]},
{t:'V ています: đang làm',p:'<b>Thể て + います</b> diễn tả hành động đang diễn ra. Với hiện tượng thời tiết, danh từ đi với <b>が</b>.',ex:[['いま あめが ふっています。','Bây giờ trời đang mưa.'],['ミラーさんは でんわを かけています。','Anh Miller đang gọi điện thoại.'],['なにを していますか。','Bạn đang làm gì vậy?'],['ほんを よんでいます。','Tôi đang đọc sách.']]},
{t:'V ましょうか: để tôi ... nhé',p:'<b>V ましょうか</b> là lời đề nghị giúp đỡ người khác. Người nhận đáp <b>おねがいします</b> (nhờ anh) hoặc <b>けっこうです</b> (không cần ạ).',ex:[['にもつを もちましょうか。','Để tôi mang hành lý giúp nhé?'],['ええ、おねがいします。','Vâng, nhờ anh.'],['いいえ、けっこうです。','Không cần đâu ạ.']]},
{t:'Chỉ đường và nói với tài xế',p:'Khi chỉ đường hoặc nói với tài xế taxi dùng thể て + ください. Kết hợp <b>まっすぐ</b> (thẳng), <b>みぎ/ひだり へ まがって</b> (rẽ phải/trái), <b>しんごう/かど を</b>. Dừng xe: <b>ここで とめて ください</b>.',ex:[['まっすぐ いって ください。','Xin hãy đi thẳng.'],['あの かどを みぎへ まがって ください。','Xin hãy rẽ phải ở góc kia.'],['ここで とめて ください。','Xin hãy dừng xe ở đây.']]}
],
q:[
{j:'',h:'Thể て của かきます (viết) là:',o:['かいて','かって','かきて','かんで'],a:0,e:'Nhóm I, き đổi thành いて.'},
{j:'',h:'Thể て của のみます (uống) là:',o:['のんで','のみて','のって','のいて'],a:0,e:'Nhóm I, み đổi thành んで.'},
{j:'',h:'Thể て của たべます (ăn) là:',o:['たべて','たべって','たべんで','たべいて'],a:0,e:'Nhóm II chỉ cần bỏ ます và thêm て.'},
{j:'',h:'Thể て của かいます (mua) là:',o:['かって','かいて','かんで','かいって'],a:0,e:'Nhóm I, い đổi thành って.'},
{j:'ちょっと ＿ ください。',h:'Xin hãy đợi một chút.',o:['まって','まちて','まいて','まんで'],a:0,e:'まちます thuộc nhóm I, ち đổi thành って.'},
{j:'いま あめが ふっ＿。',h:'Bây giờ trời đang mưa.',o:['ています','ていました','ませんでした','ましょう'],a:0,e:'Thể て + います diễn tả hành động đang diễn ra.'},
{j:'にもつを もち＿。',h:'Để tôi mang hành lý giúp nhé?',o:['ましょうか','てください','ています','たいです'],a:0,e:'V ましょうか là lời đề nghị giúp đỡ.'},
{j:'',h:'Nhóm III (bất quy tắc) gồm những động từ nào?',o:['します, きます','たべます, みます','かきます, のみます','いきます, かいます'],a:0,e:'Nhóm III chỉ có します, きます và danh từ + します.'}
]},

{n:15, t:'Xin phép, cấm đoán và trạng thái',
v:[

/* ---------- Speech ---------- */
let jaVoice = null, voicesChecked = false;
const hasSpeech = 'speechSynthesis' in window;
function loadVoices(){
  if (!hasSpeech) return;
  try {
    const vs = speechSynthesis.getVoices();
    if (vs.length) { voicesChecked = true; jaVoice = vs.find(v => /^ja/i.test(v.lang)) || null; }
  } catch (e) {}
  updateVoiceSlots();
}
if (hasSpeech) {
  try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {}
  loadVoices();
  setTimeout(() => { voicesChecked = true; loadVoices(); }, 2500);
}
function speak(text){
  if (!hasSpeech) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.8;
    if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function voiceNote(){
  if (!hasSpeech) return '<div class="notice">Trình duyệt này không đọc được tiếng Nhật. Hãy mở trang bằng Chrome, Safari hoặc Edge bản mới.</div>';
  if (voicesChecked && !jaVoice) return '<div class="notice">Thiết bị chưa có giọng đọc tiếng Nhật nên phát âm có thể không chuẩn. Bạn có thể cài thêm giọng tiếng Nhật trong phần cài đặt Chuyển văn bản thành giọng nói (Text-to-speech) của máy.</div>';
  return '';
}
function updateVoiceSlots(){ document.querySelectorAll('.voice-slot').forEach(el => { el.innerHTML = voiceNote(); }); }
function ping(el){ el.classList.add('ping'); setTimeout(() => el.classList.remove('ping'), 450); }

/* ---------- Picker (shared by flashcards and quiz) ---------- */
/* p.rows = selection of the active script; p.saved keeps the other scripts' selections separately */
function makePicker(script, rows){ return {script, rows:new Set(rows), saved:{}, custom:null}; }
function clonePicker(p){
  const saved = {};
  for (const k in p.saved) saved[k] = new Set(p.saved[k]);
  return {script:p.script, rows:new Set(p.rows), saved, custom:p.custom ? p.custom.slice() : null};
}
function pickerItems(p){
  if (p.custom) return p.custom.map(k => ITEMS[k]).filter(Boolean);
  const scripts = p.script === 'both' ? ['hira','kata'] : [p.script];
  const out = [], seen = new Set();
  const add = it => { if (it && !seen.has(it.k)) { seen.add(it.k); out.push(it); } };
  for (const sc of scripts) {
    for (const row of ROWS) if (p.rows.has(row.id)) BYROW[sc][row.id].forEach(add);
    if (p.rows.has('conf')) confKeys(sc).forEach(k => add(ITEMS[k]));
  }
  return out;
}
function chipLabel(id, sc){
  if (id === 'conf') return 'Chữ dễ nhầm';
  if (id === 'ext') return 'ファ・ティ…';
  const row = ROWMAP[id];
  let base = row.c.find(Boolean)[0];
  if (id === 'w') base += '・ん';
  if (sc === 'kata') return toKata(base);
  if (sc === 'both') return base + ' / ' + toKata(base);
  return base;
}
function pickerHTML(p, pk){
  const sc = p.script;
  let h = '<div class="picker"><div class="seg" role="group" aria-label="Chọn bảng chữ">' +
    [['hira','Hiragana'],['kata','Katakana'],['both','Cả hai']].map(([v, l]) =>
      `<button type="button" data-act="p-script" data-pk="${pk}" data-v="${v}" aria-pressed="${sc === v}">${l}</button>`).join('') + '</div>';
  if (p.custom) {
    h += `<div class="custom"><p><b>Đang ôn ${p.custom.length} chữ hay sai:</b></p><span class="kana">${p.custom.join(' ')}</span><button type="button" class="btn sm" data-act="p-uncustom" data-pk="${pk}">Chọn lại theo hàng</button></div>`;
  } else {
    for (const G of GROUPS) {
      if (G.kataOnly && sc === 'hira') continue;
      const all = G.ids.every(id => p.rows.has(id));
      h += `<div class="pgroup"><button type="button" class="glabel" data-act="p-group" data-pk="${pk}" data-v="${G.g}" aria-pressed="${all}" title="Chọn hoặc bỏ cả nhóm">${G.label}</button><div class="chips">`;
      for (const id of G.ids) {
        const txt = id === 'conf';
        h += `<button type="button" class="chip${txt ? ' txt' : ''}" data-act="p-row" data-pk="${pk}" data-v="${id}" aria-pressed="${p.rows.has(id)}">${chipLabel(id, sc)}</button>`;
      }
      h += '</div></div>';
    }
  }
  const n = pickerItems(p).length;
  h += `<div class="pfoot"><span>Đã chọn <b>${n}</b> chữ</span>${!p.custom && p.rows.size ? `<button type="button" class="linkbtn" data-act="p-clear" data-pk="${pk}">Bỏ chọn hết</button>` : ''}</div></div>`;
  return h;
}
function pickerHandle(p, act, v){
  if (act === 'p-script') {
    if (v !== p.script) { p.saved[p.script] = p.rows; p.rows = p.saved[v] || new Set(); p.script = v; }
    if (v === 'hira') p.rows.delete('ext');
  }
  else if (act === 'p-row') { p.rows.has(v) ? p.rows.delete(v) : p.rows.add(v); }
  else if (act === 'p-group') {
    const G = GROUPS.find(g => g.g === v);
    const all = G.ids.every(id => p.rows.has(id));
    G.ids.forEach(id => all ? p.rows.delete(id) : p.rows.add(id));
  }
  else if (act === 'p-clear') p.rows.clear();
  else if (act === 'p-uncustom') p.custom = null;
}

/* ---------- 1. Chart ---------- */
const chart = {sc:'hira', open:new Set()};
function cellHTML(entry, sc){
  if (!entry) return '<div class="cell blank" aria-hidden="true"></div>';
  const k = sc === 'kata' && !/[゠-ヿ]/.test(entry[0]) ? toKata(entry[0]) : entry[0];
  const it = ITEMS[k];
  return `<button type="button" class="cell" data-act="say" data-k="${it.k}" aria-label="${it.k}, đọc là ${it.r}">${mastered(it.k) ? '<span class="stamp" title="Đã thuộc">済</span>' : ''}<span class="k">${it.k}</span><span class="r">${it.r}</span></button>`;
}
function gridRows(ids, sc, cols){
  let h = '';
  for (const id of ids) {
    const c = ROWMAP[id].c;
    h += c.slice(0, cols).map(e => cellHTML(e, sc)).join('');
    if (c.length > cols) h += cellHTML(c[cols], sc) + '<div class="cell blank" aria-hidden="true"></div>'.repeat(cols - 1);
  }
  return h;
}
function renderChart(){
  const sc = chart.sc;
  const name = sc === 'hira' ? 'Hiragana' : 'Katakana';
  let h = `<div class="box"><div class="bar"><div class="seg" role="group" aria-label="Chọn bảng chữ">
    <button type="button" data-act="chart-sc" data-v="hira" aria-pressed="${sc === 'hira'}">Hiragana ひらがな</button>
    <button type="button" data-act="chart-sc" data-v="kata" aria-pressed="${sc === 'kata'}">Katakana カタカナ</button></div>
    <span class="legend"><span class="stamp">済</span> đã thuộc (nhớ đúng ít nhất 3 lần)</span></div>
    <p class="hint" style="margin-top:10px">Bấm vào chữ để nghe phát âm.</p><div class="voice-slot">${voiceNote()}</div></div>`;
  h += `<div class="sec"><div class="sec-h"><h2>${name} cơ bản</h2><span>46 chữ, đọc theo hàng ngang a · i · u · e · o</span></div><div class="grid5">${gridRows(BASIC, sc, 5)}</div></div>`;
  h += `<div class="sec"><div class="sec-h"><h2>Âm đục ゛ và bán đục ゜</h2><span>25 chữ</span></div><div class="grid5">${gridRows(DAK, sc, 5)}</div></div>`;
  h += `<div class="sec"><div class="sec-h"><h2>Âm ghép</h2><span>33 âm, chữ thứ hai viết nhỏ</span></div><div class="grid3">${gridRows(YOON, sc, 3)}</div></div>`;
  if (sc === 'kata') {
    h += `<div class="sec"><div class="sec-h"><h2>Âm mở rộng</h2><span>Chỉ dùng cho từ ngoại lai</span></div><div class="grid5">${BYROW.kata.ext.map(it => cellHTML([it.k, it.r], 'kata')).join('')}</div></div>`;
  }
  h += `<div class="sec" id="dacbiet"><div class="sec-h"><h2>Quy tắc đọc cần nhớ</h2><span>Bấm vào ví dụ để nghe</span></div><div class="notes">` +
    NOTES[sc].map(n => `<div class="note"><h3>${n.t}</h3><p>${n.p}</p><div class="ex">${n.ex.map(([w, r, m]) =>
      `<button type="button" class="ex-b" data-act="say" data-k="${w}"><span class="k">${w}</span><span class="r">${r} · ${m}</span></button>`).join('')}</div></div>`).join('') + '</div></div>';
  const allOpen = WORDS[sc].every(w => chart.open.has(w[0]));
  h += `<div class="sec" id="tapdoc"><div class="sec-h"><h2>Tập đọc từ</h2><button type="button" class="linkbtn" data-act="words-all">${allOpen ? 'Ẩn hết cách đọc' : 'Hiện hết cách đọc'}</button></div>
    <p class="hint" style="margin-bottom:10px">Tự đọc từ trước, rồi bấm để xem cách đọc, nghĩa và nghe phát âm.</p><div class="words">` +
    WORDS[sc].map(([w, r, m], i) => { const o = chart.open.has(w);
