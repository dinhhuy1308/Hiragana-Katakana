<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện Kana 21 Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: one centered working column (max 980px) with a sticky tab bar; each tool opens ready to use.
   Light-only by request: practice-notebook paper, indigo ink, shu-red seal for mastered characters. */
:root{
  --bg:#F2F4F8;
  --surface:#FFFFFF;
  --ink:#1C2140;
  --muted:#5A6180;
  --line:#DCE1EC;
  --line-soft:#ECEFF5;
  --accent:#2B47C2;
  --accent-ink:#FFFFFF;
  --accent-soft:#E7ECFC;
  --seal:#C63F29;
  --seal-ink:#FFFFFF;
  --seal-soft:#FCEDEA;
  --seal-line:#F0C9C0;
  --guide:#E5AFA3;
  --model:rgba(43,71,194,.17);
  --peek:rgba(198,63,41,.32);
  --ok:#1D7A52;
  --ok-soft:#E2F3EA;
  --bad:#B3312A;
  --bad-soft:#FBE6E4;
  --shadow:rgba(28,33,64,.08);
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-kana:"Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.seal{flex:0 0 auto;width:46px;height:46px;border-radius:8px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-kana);font-weight:600;font-size:15px;writing-mode:vertical-rl;letter-spacing:.08em;transform:rotate(-3deg)}
h1{font-size:1.45rem;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.meters{display:flex;gap:6px;flex-wrap:wrap}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter b{color:var(--ink);font-weight:600}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:14px;padding-block:8px}
.tabs-in{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;font-weight:600;font-size:.92rem;color:var(--muted);padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* Shared */
.panel{margin-top:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
h2{font-size:1.08rem;margin:0 0 4px;text-wrap:balance}
h3{font-size:1rem;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:.87rem;margin:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--line-soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:.87rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow),0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.92rem;padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.again{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{flex:0 0 auto}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:.85rem}
.progress{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.notice{background:var(--seal-soft);border:1px solid var(--seal-line);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:12px}
.empty-state{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
.kana{font-family:var(--f-kana)}

/* Picker */
.picker{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.pgroup{display:flex;gap:6px 10px;align-items:flex-start;flex-wrap:wrap}
.glabel{flex:0 0 92px;border:0;background:transparent;text-align:left;font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:7px 0;cursor:pointer}
.glabel[aria-pressed="true"]{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-family:var(--f-kana);font-size:1.02rem;cursor:pointer;color:var(--ink);line-height:1.5}
.chip.txt{font-family:var(--f-body);font-size:.84rem;font-weight:500;padding:5px 12px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pfoot{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:.86rem;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px}
.pfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.custom{background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.custom p{margin:0;font-size:.9rem}
.custom .kana{font-size:1.15rem;letter-spacing:.08em;word-break:break-all}

/* Chart */
.legend{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h span{color:var(--muted);font-size:.85rem}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:440px}
.cell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.cell .k{font-family:var(--f-kana);font-size:clamp(1.45rem,4.8vw,2.1rem);line-height:1.25}
.cell .r{font-size:.78rem;color:var(--muted)}
.cell:hover{border-color:var(--accent)}
.cell.ping{background:var(--accent-soft);border-color:var(--accent)}
.cell.blank{border:1px dashed var(--line-soft);background:transparent;cursor:default}
.stamp{width:18px;height:18px;border:1.5px solid var(--seal);color:var(--seal);border-radius:50%;font-family:var(--f-kana);font-size:10px;font-weight:600;display:inline-grid;place-items:center;line-height:1;transform:rotate(-10deg);background:var(--surface)}
.cell .stamp{position:absolute;top:4px;right:4px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.note h3{font-size:.96rem;margin-bottom:4px}
.note p{margin:0 0 10px;font-size:.87rem;color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex-b{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.ex-b:hover{border-color:var(--accent)}
.ex-b .k{font-family:var(--f-kana);font-size:1.1rem;line-height:1.3}
.ex-b .r{font-size:.75rem;color:var(--muted)}
.ex-b.ping{background:var(--accent-soft)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.word{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-width:0}
.word:hover{border-color:var(--accent)}
.word .k{font-family:var(--f-kana);font-size:1.4rem;line-height:1.3;word-break:break-all}
.word .wr{font-size:.8rem;color:var(--muted)}
.word[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.word[aria-expanded="true"] .wr{color:var(--ink)}

/* Flashcards */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage-top{width:min(100%,360px);display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.flash{width:min(100%,360px);height:250px;border:1px solid var(--line);border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 22px var(--shadow);
  background:linear-gradient(var(--line-soft),var(--line-soft)) center/1px 100% no-repeat,linear-gradient(var(--line-soft),var(--line-soft)) center/100% 1px no-repeat,var(--surface)}
.flash .big{font-family:var(--f-kana);font-size:6.2rem;line-height:1.1}
.flash .big.two{font-size:4.6rem}
.flash .rom{font-size:2.1rem;font-weight:700;color:var(--accent);line-height:1.2}
.flash .rom.front{font-size:3rem;color:var(--ink)}
.flash .small{font-family:var(--f-kana);font-size:2.4rem;line-height:1.2}
.flash .tap{font-size:.8rem;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;width:min(100%,360px)}
.actions .btn{flex:1}
.keys{font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}

/* Quiz */
.q-head{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);width:min(100%,400px);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:5px;width:min(100%,400px)}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line-soft);border:1px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.dots i.now{border:2px solid var(--accent);background:var(--surface)}
.q-kana{font-family:var(--f-kana);font-size:5.4rem;line-height:1.15;min-height:1.15em}
.q-kana.two{font-size:4.2rem}
.q-listen{width:110px;height:110px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.q-listen:hover{background:var(--accent);color:var(--accent-ink)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,400px)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-size:1.15rem;font-weight:600;cursor:pointer;min-width:0}
.opt.kana{font-family:var(--f-kana);font-size:1.9rem;font-weight:400;padding:8px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}
.fb{margin:0;font-size:.95rem;text-align:center}
.fb.ok{color:var(--ok)}
.fb.no{color:var(--bad)}
.fb .kana{font-size:1.2rem}
.score{font-size:3.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.4rem;color:var(--muted);font-weight:600}
.settings{display:flex;flex-direction:column;gap:14px}
.setting-l{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.missed span{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:3px 9px;font-size:.85rem}
.missed span b{font-family:var(--f-kana);font-size:1.15rem;font-weight:400;margin-right:4px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

select{font:inherit;font-size:.92rem;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}

/* Vocabulary by topic */
.word{position:relative}
.word .stamp{position:absolute;top:8px;right:8px}
.vw{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.flash .big.mid{font-size:3.2rem}
.flash .big.sm{font-size:2.1rem}
.flash .rd{font-family:var(--f-kana);font-size:1.5rem;color:var(--accent);line-height:1.3}
.flash .mean{font-size:1.3rem;font-weight:600;text-align:center;padding:0 14px;line-height:1.35}
.flash .mean.front{font-size:1.6rem}
.q-kana.mid{font-size:3rem}
.q-kana.sm{font-size:2rem;text-align:center}
.q-mean{font-size:1.6rem;font-weight:700;text-align:center;min-height:1.6em}
.opt.vo{font-size:1rem;padding:12px 8px}
.opt.kana.jw{font-size:1.25rem;padding:10px 6px}
.vfilter{margin-top:12px;flex-wrap:wrap;gap:10px}
.reset{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .cell,.ex-b,.chip,.opt,.btn,.word{transition:background-color .15s,border-color .15s}
  .progress i{transition:width .3s}
}
</style>

</head>
<body style="margin:0">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">かな</div>
      <div>
        <h1>Luyện Tiếng Nhật Sơ Cấp</h1>
        <p class="sub">Bảng chữ kana và từ vựng theo chủ đề thông dụng</p>
      </div>
    </div>
    <div class="meters" id="meters"></div>
  </header>

  <nav class="tabs" aria-label="Các phần luyện tập">
    <div class="tabs-in" role="tablist" id="tabs"></div>
  </nav>

  <section class="panel" id="p-bang" role="tabpanel" hidden></section>
  <section class="panel" id="p-the" role="tabpanel" hidden></section>
  <section class="panel" id="p-kiemtra" role="tabpanel" hidden></section>
  <section class="panel" id="p-tuvung" role="tabpanel" hidden></section>
  <div class="reset" id="reset"></div>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const toKata = s => s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Data ---------- */
const ROWS = [
  {id:'a',g:'basic',c:[['あ','a'],['い','i'],['う','u'],['え','e'],['お','o']]},
  {id:'k',g:'basic',c:[['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko']]},
  {id:'s',g:'basic',c:[['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so']]},
  {id:'t',g:'basic',c:[['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to']]},
  {id:'n',g:'basic',c:[['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no']]},
  {id:'h',g:'basic',c:[['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho']]},
  {id:'m',g:'basic',c:[['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo']]},
  {id:'y',g:'basic',c:[['や','ya'],null,['ゆ','yu'],null,['よ','yo']]},
  {id:'r',g:'basic',c:[['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro']]},
  {id:'w',g:'basic',c:[['わ','wa'],null,null,null,['を','wo'],['ん','n']]},
  {id:'g',g:'dak',c:[['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go']]},
  {id:'z',g:'dak',c:[['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo']]},
  {id:'d',g:'dak',c:[['だ','da'],['ぢ','ji'],['づ','zu'],['で','de'],['ど','do']]},
  {id:'b',g:'dak',c:[['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo']]},
  {id:'p',g:'dak',c:[['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po']]},
  {id:'ky',g:'yoon',c:[['きゃ','kya'],['きゅ','kyu'],['きょ','kyo']]},
  {id:'sh',g:'yoon',c:[['しゃ','sha'],['しゅ','shu'],['しょ','sho']]},
  {id:'ch',g:'yoon',c:[['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho']]},
  {id:'ny',g:'yoon',c:[['にゃ','nya'],['にゅ','nyu'],['にょ','nyo']]},
  {id:'hy',g:'yoon',c:[['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo']]},
  {id:'my',g:'yoon',c:[['みゃ','mya'],['みゅ','myu'],['みょ','myo']]},
  {id:'ry',g:'yoon',c:[['りゃ','rya'],['りゅ','ryu'],['りょ','ryo']]},
  {id:'gy',g:'yoon',c:[['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo']]},
  {id:'j',g:'yoon',c:[['じゃ','ja'],['じゅ','ju'],['じょ','jo']]},
  {id:'by',g:'yoon',c:[['びゃ','bya'],['びゅ','byu'],['びょ','byo']]},
  {id:'py',g:'yoon',c:[['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo']]},
  {id:'ext',g:'ext',kataOnly:true,c:[['ファ','fa'],['フィ','fi'],['フェ','fe'],['フォ','fo'],['ティ','ti'],['ディ','di'],['ウィ','wi'],['ウェ','we'],['ウォ','wo'],['シェ','she'],['ジェ','je'],['チェ','che'],['ヴ','vu']]}
];
const BASIC = ['a','k','s','t','n','h','m','y','r','w'];
const DAK = ['g','z','d','b','p'];
const YOON = ['ky','sh','ch','ny','hy','my','ry','gy','j','by','py'];
const GROUPS = [
  {g:'basic',label:'Cơ bản',ids:BASIC},
  {g:'dak',label:'Âm đục',ids:DAK},
  {g:'yoon',label:'Âm ghép',ids:YOON},
  {g:'ext',label:'Mở rộng',ids:['ext'],kataOnly:true},
  {g:'conf',label:'Luyện riêng',ids:['conf']}
];
const ROWMAP = Object.fromEntries(ROWS.map(r => [r.id, r]));
const ITEMS = {};
const BYROW = {hira:{}, kata:{}};
for (const row of ROWS) {
  for (const sc of ['hira','kata']) {
    if (row.kataOnly && sc === 'hira') { BYROW[sc][row.id] = []; continue; }
    BYROW[sc][row.id] = row.c.filter(Boolean).map(([k, r]) => {
      const kk = (sc === 'kata' && !row.kataOnly) ? toKata(k) : k;
      return ITEMS[kk] || (ITEMS[kk] = {k:kk, r, row:row.id, sc});
    });
  }
}
const ALL = Object.values(ITEMS);
const TOTAL = {hira: ALL.filter(i => i.sc === 'hira').length, kata: ALL.filter(i => i.sc === 'kata').length};

/* ---------- Storage ---------- */
const KEY = 'luyen-kana-21-v1';
let store = {stats:{}, tab:'bang'};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') store = Object.assign(store, s); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function mark(k, ok){
  const s = store.stats[k] || (store.stats[k] = {c:0, w:0});
  if (ok) s.c++; else s.w++;
  save(); renderMeters();
}
function mastered(k){ const s = store.stats[k]; return !!s && s.c >= 3 && s.c >= 2 * s.w; }

   v: 'kana|nghĩa|kanji (tuỳ chọn)|romaji (chỉ ghi khi khác cách tự chuyển đổi)'. */
const RO_TAB = {};
(function(){
  const ks = Array.from('あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ');
  'a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po'
    .split(' ').forEach((r, i) => { RO_TAB[ks[i]] = r; });
})();
function toRomaji(src){
  const s = Array.from(src.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)));
  let out = '', dbl = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i], nx = s[i + 1];
    if (c === 'っ') { dbl = true; continue; }
    if (c === 'ー') { out = out.replace(/[aiueo]$/, m => ({a:'ā', i:'ī', u:'ū', e:'ē', o:'ō'})[m]); continue; }
    let r = RO_TAB[c];
    if (!r) { out += c; continue; }
    if (nx && 'ゃゅょ'.includes(nx)) {
      r = (/^(sh|ch|j)i$/.test(r) ? r.slice(0, -1) : r.slice(0, -1) + 'y') + ({ゃ:'a', ゅ:'u', ょ:'o'})[nx]; i++;
    } else if (nx && 'ぁぃぅぇぉ'.includes(nx)) {
      r = (c === 'う' ? 'w' : r.replace(/[aiueo]+$/, '')) + ({ぁ:'a', ぃ:'i', ぅ:'u', ぇ:'e', ぉ:'o'})[nx]; i++;
    } else if (c === 'ん' && nx && /[あいうえおやゆよ]/.test(nx)) r = "n'";
    if (dbl) { r = (r.startsWith('ch') ? 't' : r[0]) + r; dbl = false; }
    out += r;
  }
  return out.replace(/aa|uu|ee|oo|ou/g, m => ({aa:'ā', uu:'ū', ee:'ē', oo:'ō', ou:'ō'})[m]);
}

/* ---------- Speech ---------- */
let jaVoice = null, voicesChecked = false;
const hasSpeech = 'speechSynthesis' in window;
function loadVoices(){
  if (!hasSpeech) return;
  try {
    const vs = speechSynthesis.getVoices();
    if (vs.length) { voicesChecked = true; jaVoice = vs.find(v => /^ja/i.test(v.lang)) || null; }
  } catch (e) {}
  updateVoiceSlots();
}
if (hasSpeech) {
  try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) {}
  loadVoices();
  setTimeout(() => { voicesChecked = true; loadVoices(); }, 2500);
}
function speak(text){
  if (!hasSpeech) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.8;
    if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function voiceNote(){
  if (!hasSpeech) return '<div class="notice">Trình duyệt này không đọc được tiếng Nhật. Hãy mở trang bằng Chrome, Safari hoặc Edge bản mới.</div>';
  if (voicesChecked && !jaVoice) return '<div class="notice">Thiết bị chưa có giọng đọc tiếng Nhật nên phát âm có thể không chuẩn. Bạn có thể cài thêm giọng tiếng Nhật trong phần cài đặt Chuyển văn bản thành giọng nói (Text-to-speech) của máy.</div>';
  return '';
}
function updateVoiceSlots(){ document.querySelectorAll('.voice-slot').forEach(el => { el.innerHTML = voiceNote(); }); }
function ping(el){ el.classList.add('ping'); setTimeout(() => el.classList.remove('ping'), 450); }

/* ---------- Picker (shared by flashcards and quiz) ---------- */
/* p.rows = selection of the active script; p.saved keeps the other scripts' selections separately */
function makePicker(script, rows){ return {script, rows:new Set(rows), saved:{}, custom:null}; }
function clonePicker(p){
  const saved = {};
  for (const k in p.saved) saved[k] = new Set(p.saved[k]);
  return {script:p.script, rows:new Set(p.rows), saved, custom:p.custom ? p.custom.slice() : null};
}
function pickerItems(p){
  if (p.custom) return p.custom.map(k => ITEMS[k]).filter(Boolean);
  const scripts = p.script === 'both' ? ['hira','kata'] : [p.script];
  const out = [], seen = new Set();
  const add = it => { if (it && !seen.has(it.k)) { seen.add(it.k); out.push(it); } };
  for (const sc of scripts) {
    for (const row of ROWS) if (p.rows.has(row.id)) BYROW[sc][row.id].forEach(add);
    if (p.rows.has('conf')) confKeys(sc).forEach(k => add(ITEMS[k]));
  }
  return out;
}
function chipLabel(id, sc){
  if (id === 'conf') return 'Chữ dễ nhầm';
  if (id === 'ext') return 'ファ・ティ…';
  const row = ROWMAP[id];
  let base = row.c.find(Boolean)[0];
  if (id === 'w') base += '・ん';
  if (sc === 'kata') return toKata(base);
  if (sc === 'both') return base + ' / ' + toKata(base);
  return base;
}
function pickerHTML(p, pk){
  const sc = p.script;
  let h = '<div class="picker"><div class="seg" role="group" aria-label="Chọn bảng chữ">' +
    [['hira','Hiragana'],['kata','Katakana'],['both','Cả hai']].map(([v, l]) =>
      `<button type="button" data-act="p-script" data-pk="${pk}" data-v="${v}" aria-pressed="${sc === v}">${l}</button>`).join('') + '</div>';
  if (p.custom) {
    h += `<div class="custom"><p><b>Đang ôn ${p.custom.length} chữ hay sai:</b></p><span class="kana">${p.custom.join(' ')}</span><button type="button" class="btn sm" data-act="p-uncustom" data-pk="${pk}">Chọn lại theo hàng</button></div>`;
  } else {
    for (const G of GROUPS) {
      if (G.kataOnly && sc === 'hira') continue;
      const all = G.ids.every(id => p.rows.has(id));
      h += `<div class="pgroup"><button type="button" class="glabel" data-act="p-group" data-pk="${pk}" data-v="${G.g}" aria-pressed="${all}" title="Chọn hoặc bỏ cả nhóm">${G.label}</button><div class="chips">`;
      for (const id of G.ids) {
        const txt = id === 'conf';
        h += `<button type="button" class="chip${txt ? ' txt' : ''}" data-act="p-row" data-pk="${pk}" data-v="${id}" aria-pressed="${p.rows.has(id)}">${chipLabel(id, sc)}</button>`;
      }
      h += '</div></div>';
    }
  }
  const n = pickerItems(p).length;
  h += `<div class="pfoot"><span>Đã chọn <b>${n}</b> chữ</span>${!p.custom && p.rows.size ? `<button type="button" class="linkbtn" data-act="p-clear" data-pk="${pk}">Bỏ chọn hết</button>` : ''}</div></div>`;
  return h;
}
function pickerHandle(p, act, v){
  if (act === 'p-script') {
    if (v !== p.script) { p.saved[p.script] = p.rows; p.rows = p.saved[v] || new Set(); p.script = v; }
    if (v === 'hira') p.rows.delete('ext');
  }
  else if (act === 'p-row') { p.rows.has(v) ? p.rows.delete(v) : p.rows.add(v); }
  else if (act === 'p-group') {
    const G = GROUPS.find(g => g.g === v);
    const all = G.ids.every(id => p.rows.has(id));
    G.ids.forEach(id => all ? p.rows.delete(id) : p.rows.add(id));
  }
  else if (act === 'p-clear') p.rows.clear();
  else if (act === 'p-uncustom') p.custom = null;
}

function cellHTML(entry, sc){

}
function gridRows(ids, sc, cols){
  let h = '';
  for (const id of ids) {
    const c = ROWMAP[id].c;
    h += c.slice(0, cols).map(e => cellHTML(e, sc)).join('');
    if (c.length > cols) h += cellHTML(c[cols], sc) + '<div class="cell blank" aria-hidden="true"></div>'.repeat(cols - 1);

}

function fcReset(){ const items = pickerItems(fc.p); fc.deck = shuffle(items.slice()); fc.total = items.length; fc.known = 0; fc.flipped = false; }
function renderFC(){

function fcFlip(){ if (!fc.deck.length) return; fc.flipped = !fc.flipped; if (fc.flipped) speak(fc.deck[0].k); renderFC(); }
function fcAgain(){ const it = fc.deck.shift(); mark(it.k, false); fc.deck.splice(Math.min(3, fc.deck.length), 0, it); fc.flipped = false; renderFC(); }
function fcGood(){ const it = fc.deck.shift(); mark(it.k, true); fc.known++; fc.flipped = false; renderFC(); }

/* ---------- 3. Quiz ---------- */
const qz = {p:makePicker('hira', BASIC), mode:'read', len:10, phase:'setup', qs:[], i:0, score:0, picked:null, results:[], missed:[]};
function weightedOrder(pool){
  return pool.map(it => { const s = store.stats[it.k] || {c:0, w:0}; const w = 1 + 2 * s.w / (s.c + 1); return [Math.pow(Math.random(), 1 / w), it]; })
    .sort((a, b) => b[0] - a[0]).map(x => x[1]);
}
function makeOpts(it, pool){
  const out = [it], used = new Set([it.r]);
  const add = c => { if (out.length < 4 && c && c.k !== it.k && !used.has(c.r)) { out.push(c); used.add(c.r); } };
  const grp = CONF[it.sc].find(g => g.includes(it.k));
  if (grp) shuffle(grp.slice()).forEach(k => add(ITEMS[k]));
  const g = ROWMAP[it.row].g;
  shuffle(pool.filter(x => x.sc === it.sc && ROWMAP[x.row].g === g)).forEach(add);
  shuffle(ALL.filter(x => x.sc === it.sc && ROWMAP[x.row].g === g)).forEach(add);
  shuffle(pool.filter(x => x.sc === it.sc)).forEach(add);
  shuffle(ALL.filter(x => x.sc === it.sc)).forEach(add);
  return shuffle(out);
}
function qStart(){
  const pool = pickerItems(qz.p);
  if (!pool.length) return;
  const qs = []; let bag = [];
  while (qs.length < qz.len) {
    if (!bag.length) bag = weightedOrder(pool);
    const it = bag.shift();
    if (qs.length && qs[qs.length - 1].item === it && pool.length > 1) { bag.push(it); continue; }
    qs.push({item:it, opts:makeOpts(it, pool)});
  }
  Object.assign(qz, {qs, i:0, score:0, picked:null, results:[], missed:[], phase:'run'});
  renderQZ();
  if (qz.mode === 'listen') speak(qs[0].item.k);
}
function qAns(idx){
  if (qz.picked !== null) return;
  const q = qz.qs[qz.i];
  if (!q.opts[idx]) return;
  qz.picked = idx;
  const ok = q.opts[idx] === q.item;
  mark(q.item.k, ok);
  qz.results.push(ok);
  if (ok) qz.score++; else if (!qz.missed.includes(q.item.k)) qz.missed.push(q.item.k);
  if (qz.mode === 'read') speak(q.item.k);
  renderQZ();
}
function qNext(){
  if (qz.picked === null) return;
  qz.i++; qz.picked = null;
  if (qz.i >= qz.qs.length) qz.phase = 'done';
  renderQZ();
  if (qz.phase === 'run' && qz.mode === 'listen') speak(qz.qs[qz.i].item.k);
}
function renderQZ(){
  let right;
  const pool = pickerItems(qz.p);
  if (qz.phase === 'setup') {
    right = `<div class="settings"><div><h2>Cài đặt bài kiểm tra</h2><p class="hint">Chữ bạn hay sai sẽ được hỏi nhiều hơn.</p></div>
      <div><div class="setting-l">Kiểu câu hỏi</div><div class="seg" role="group" aria-label="Kiểu câu hỏi">
        <button type="button" data-act="q-mode" data-v="read" aria-pressed="${qz.mode === 'read'}">Nhìn chữ, chọn cách đọc</button>
        <button type="button" data-act="q-mode" data-v="listen" aria-pressed="${qz.mode === 'listen'}">Nghe âm, chọn chữ</button></div></div>
      <div><div class="setting-l">Số câu</div><div class="seg" role="group" aria-label="Số câu">
        ${[10, 20, 30].map(n => `<button type="button" data-act="q-len" data-v="${n}" aria-pressed="${qz.len === n}">${n} câu</button>`).join('')}</div></div>
      ${qz.mode === 'listen' ? `<div class="voice-slot">${voiceNote()}</div>` : ''}
      <div><button type="button" class="btn primary" data-act="q-start" ${pool.length ? '' : 'disabled'}>Bắt đầu kiểm tra</button>
      ${pool.length ? '' : '<p class="hint" style="margin-top:8px">Chọn ít nhất một hàng chữ để bắt đầu.</p>'}</div></div>`;
  } else if (qz.phase === 'run') {
    const q = qz.qs[qz.i], it = q.item, ans = qz.picked !== null;
    const dots = qz.qs.map((_, j) => `<i class="${j < qz.results.length ? (qz.results[j] ? 'ok' : 'no') : (j === qz.i ? 'now' : '')}"></i>`).join('');
    const prompt = qz.mode === 'read'
      ? `<div class="q-kana${it.k.length > 1 ? ' two' : ''}">${it.k}</div>`
      : `<button type="button" class="q-listen" data-act="q-say" aria-label="Nghe lại âm">${ICON.soundBig}</button><p class="hint">${ans ? `<span class="kana" style="font-size:1.4rem;color:var(--ink)">${it.k}</span> · ${it.r}` : 'Bấm để nghe lại'}</p>`;
    const opts = q.opts.map((o, j) => {
      let cls = 'opt' + (qz.mode === 'listen' ? ' kana' : '');
      if (ans) cls += o === it ? ' right' : (j === qz.picked ? ' wrong' : ' dim');
      return `<button type="button" class="${cls}" data-act="q-ans" data-i="${j}" ${ans ? 'disabled' : ''}>${qz.mode === 'read' ? o.r : o.k}</button>`;
    }).join('');
    let fb = '';
    if (ans) {
      const ok = q.opts[qz.picked] === it;
      fb = `<p class="fb ${ok ? 'ok' : 'no'}">${ok ? 'Chính xác!' : 'Chưa đúng.'} <span class="kana">${it.k}</span> đọc là <b>${it.r}</b>.</p>
        <button type="button" class="btn primary" data-act="q-next">${qz.i + 1 < qz.qs.length ? 'Câu tiếp' : 'Xem kết quả'}</button>`;
    }
    right = `<div class="stage"><div class="q-head"><span>Câu ${qz.i + 1}/${qz.qs.length}</span><span>Đúng ${qz.score}</span></div><div class="dots">${dots}</div>
      ${prompt}<div class="opts">${opts}</div>${fb}<p class="keys">Phím tắt: 1–4 để chọn · Enter sang câu tiếp</p>
      <button type="button" class="linkbtn" data-act="q-setup">Dừng bài kiểm tra</button></div>`;
  } else {
    const r = qz.score / qz.qs.length;
    const msg = r >= 0.9 ? 'Rất tốt! Bạn đã nắm chắc phần này.' : r >= 0.7 ? 'Khá tốt. Ôn thêm các chữ sai rồi làm lại nhé.' : 'Cần ôn thêm. Học lại bằng thẻ nhớ rồi quay lại kiểm tra.';
    right = `<div class="stage"><div class="score">${qz.score}<small>/${qz.qs.length}</small></div><p class="fb">${msg}</p>
      ${qz.missed.length ? `<div class="missed">${qz.missed.map(k => `<span><b>${k}</b>${ITEMS[k].r}</span>`).join('')}</div>` : ''}
      <div class="row-btns">${qz.missed.length ? '<button type="button" class="btn primary" data-act="q-review">Ôn chữ sai bằng thẻ nhớ</button>' : ''}
      <button type="button" class="btn${qz.missed.length ? '' : ' primary'}" data-act="q-start">Làm bài mới</button><button type="button" class="btn" data-act="q-setup">Đổi cài đặt</button></div></div>`;
  }
  $('#p-kiemtra').innerHTML = `<div class="split"><div class="box"><h2>Phạm vi kiểm tra</h2><p class="hint">Đổi phạm vi sẽ dừng bài đang làm.</p>${pickerHTML(qz.p, 'qz')}</div><div class="box">${right}</div></div>`;
}


/* ---------- 4. Vocabulary ---------- */
/* topic 0 = tất cả chủ đề; sc lọc theo bảng chữ của từ; ro bật/tắt romaji */
const vc = {topic:1, sc:'all', ro:true, mode:'list', hide:false, open:new Set(), front:'jp', deck:[], total:0, known:0, flipped:false,
  dir:'jp2vi', len:10, phase:'setup', qs:[], i:0, score:0, picked:null, results:[], missed:[]};
const vcWords = () => (vc.topic ? TOPICS[vc.topic - 1].words : ALLVOCAB).filter(w => vc.sc === 'all' || w.sc === vc.sc);
const wSize = w => w.length <= 4 ? '' : w.length <= 8 ? ' mid' : ' sm';
function vcReset(){ vc.deck = shuffle(vcWords().slice()); vc.total = vc.deck.length; vc.known = 0; vc.flipped = false; }
function vcReload(){ vc.open.clear(); vc.phase = 'setup'; vcReset(); }
function vcFlip(){ if (!vc.deck.length) return; vc.flipped = !vc.flipped; if (vc.flipped) speakJa(vc.deck[0].r); renderVocab(); }
function vcAgain(){ const w = vc.deck.shift(); mark(w.key, false); vc.deck.splice(Math.min(3, vc.deck.length), 0, w); vc.flipped = false; renderVocab(); }
function vcGood(){ const w = vc.deck.shift(); mark(w.key, true); vc.known++; vc.flipped = false; renderVocab(); }
function vqOpts(it){
  const f = vc.dir === 'jp2vi' ? 'm' : 'w';
  const out = [it], used = new Set([it[f]]);
  const add = c => { if (out.length < 4 && c.key !== it.key && !used.has(c[f])) { out.push(c); used.add(c[f]); } };
  shuffle(vcWords().slice()).forEach(add);
  shuffle(ALLVOCAB.slice()).forEach(add);
  return shuffle(out);
}
function vqStart(){
  const pool = shuffle(vcWords().slice()).slice(0, vc.len);
  if (!pool.length) return;
  Object.assign(vc, {qs:pool.map(it => ({item:it, opts:vqOpts(it)})), i:0, score:0, picked:null, results:[], missed:[], phase:'run'});
  renderVocab();
  if (vc.dir === 'jp2vi') speakJa(pool[0].r);
}
function vqAns(idx){
  if (vc.picked !== null) return;
  const q = vc.qs[vc.i];
  if (!q.opts[idx]) return;
  vc.picked = idx;
  const ok = q.opts[idx] === q.item;
  mark(q.item.key, ok);
  vc.results.push(ok);
  if (ok) vc.score++; else if (!vc.missed.includes(q.item)) vc.missed.push(q.item);
  speakJa(q.item.r);
  renderVocab();
}
function vqNext(){
  if (vc.picked === null) return;
  vc.i++; vc.picked = null;
  if (vc.i >= vc.qs.length) vc.phase = 'done';
  renderVocab();
  if (vc.phase === 'run' && vc.dir === 'jp2vi') speakJa(vc.qs[vc.i].item.r);
}
function vocabList(ws){
  if (!ws.length) return '<div class="box"><div class="empty-state"><b>Không có từ nào</b>Chủ đề này không có từ viết bằng bảng chữ đang lọc.</div></div>';
  const h = ws.map((w, i) => {
    const show = !vc.hide || vc.open.has(w.key);
    return `<button type="button" class="word" data-act="v-word" data-i="${i}" ${vc.hide ? `aria-expanded="${show}"` : ''}>${mastered(w.key) ? '<span class="stamp" title="Đã thuộc">済</span>' : ''}<span class="k">${w.w}</span><span class="wr">${show ? [vc.ro ? w.ro : '', w.m, w.kj].filter(Boolean).join(' · ') : 'Bấm để xem'}</span></button>`;
  }).join('');
  return `<div class="box"><div class="bar"><p class="hint">Bấm vào từ để nghe phát âm.</p>
    <button type="button" class="linkbtn" data-act="v-hide">${vc.hide ? 'Hiện hết nghĩa' : 'Ẩn nghĩa để tự kiểm tra'}</button></div>
    <div class="voice-slot">${voiceNote()}</div><div class="words vw" style="margin-top:12px">${h}</div></div>`;
}
function vocabCard(){
  if (!vc.total) return '<div class="box"><div class="empty-state"><b>Chưa có thẻ nào</b></div></div>';
  if (!vc.deck.length) return `<div class="box"><div class="stage"><div class="empty-state" style="padding-bottom:8px"><b>Bạn đã nhớ hết ${vc.total} thẻ</b>Làm bài trắc nghiệm để kiểm tra lại bài này.</div>
    <div class="row-btns"><button type="button" class="btn primary" data-act="v-toquiz">Làm trắc nghiệm</button><button type="button" class="btn" data-act="v-restart">Học lại từ đầu</button></div></div></div>`;
  const w = vc.deck[0], sz = wSize(w.w);
  const back = `<span class="small">${w.w}</span>${vc.ro ? `<span class="rd">${w.ro}</span>` : ''}<span class="mean">${w.m}</span>${w.kj ? `<span class="small">${w.kj}</span>` : ''}`;
  let face;
  if (vc.front === 'jp') face = vc.flipped ? back : `<span class="big${sz}">${w.w}</span><span class="tap">Bấm để lật thẻ</span>`;
  else face = vc.flipped ? back : `<span class="mean front">${w.m}</span><span class="tap">Nhớ từ tiếng Nhật rồi bấm để lật</span>`;
  const pct = Math.round(vc.known / vc.total * 100);
  return `<div class="box"><div class="stage">
    <div class="seg" role="group" aria-label="Mặt trước của thẻ"><button type="button" data-act="v-front" data-v="jp" aria-pressed="${vc.front === 'jp'}">Mặt trước: tiếng Nhật</button><button type="button" data-act="v-front" data-v="vi" aria-pressed="${vc.front === 'vi'}">Mặt trước: nghĩa</button></div>
    <div class="stage-top"><div class="progress"><i style="width:${pct}%"></i></div><span>Đã nhớ ${vc.known}/${vc.total} · còn ${vc.deck.length} thẻ</span></div>
    <button type="button" class="flash" data-act="v-flip" aria-label="Thẻ ghi nhớ, bấm để lật">${face}</button>
    <div class="actions">${vc.flipped
      ? `<button type="button" class="btn again" data-act="v-again">Chưa nhớ</button><button type="button" class="btn sm" data-act="say" data-k="${w.r.split('／')[0].replace(/[～]/g, '')}" aria-label="Nghe lại">${ICON.sound}</button><button type="button" class="btn good" data-act="v-good">Nhớ rồi</button>`
      : '<button type="button" class="btn primary" data-act="v-flip">Lật thẻ</button>'}</div>
    <p class="keys">Phím tắt: Space để lật · 1 chưa nhớ · 2 nhớ rồi</p></div></div>`;
}
function vocabQuiz(){
  if (vc.phase === 'setup') {
    return `<div class="box"><div class="settings"><div><h2>Cài đặt trắc nghiệm</h2><p class="hint">Chỉ hỏi các từ của chủ đề đang chọn.</p></div>
      <div><div class="setting-l">Kiểu câu hỏi</div><div class="seg" role="group" aria-label="Kiểu câu hỏi">
        <button type="button" data-act="vq-dir" data-v="jp2vi" aria-pressed="${vc.dir === 'jp2vi'}">Nhìn từ, chọn nghĩa</button>
        <button type="button" data-act="vq-dir" data-v="vi2jp" aria-pressed="${vc.dir === 'vi2jp'}">Đọc nghĩa, chọn từ</button></div></div>
      <div><div class="setting-l">Số câu</div><div class="seg" role="group" aria-label="Số câu">
        ${[10, 20, 30].map(n => `<button type="button" data-act="vq-len" data-v="${n}" aria-pressed="${vc.len === n}">${n} câu</button>`).join('')}</div></div>
      <div><button type="button" class="btn primary" data-act="vq-start" ${vcWords().length ? '' : 'disabled'}>Bắt đầu</button></div></div></div>`;
  }
  if (vc.phase === 'run') {
    const q = vc.qs[vc.i], it = q.item, ans = vc.picked !== null, j2v = vc.dir === 'jp2vi';
    const dots = vc.qs.map((_, j) => `<i class="${j < vc.results.length ? (vc.results[j] ? 'ok' : 'no') : (j === vc.i ? 'now' : '')}"></i>`).join('');
    const prompt = j2v
      ? `<div class="q-kana${wSize(it.w)}">${it.w}</div><button type="button" class="btn sm" data-act="vq-say">${ICON.sound}Nghe</button>`
      : `<div class="q-mean">${it.m}</div>`;
    const opts = q.opts.map((o, j) => {
      let cls = 'opt ' + (j2v ? 'vo' : 'kana jw');
      if (ans) cls += o === it ? ' right' : (j === vc.picked ? ' wrong' : ' dim');
      return `<button type="button" class="${cls}" data-act="vq-ans" data-i="${j}" ${ans ? 'disabled' : ''}>${j2v ? o.m : o.w}</button>`;
    }).join('');
    let fb = '';
    if (ans) {
      const ok = q.opts[vc.picked] === it;
      fb = `<p class="fb ${ok ? 'ok' : 'no'}">${ok ? 'Chính xác!' : 'Chưa đúng.'} <span class="kana">${it.w}</span>${vc.ro ? ` (${it.ro})` : ''} nghĩa là <b>${it.m}</b>.</p>
        <button type="button" class="btn primary" data-act="vq-next">${vc.i + 1 < vc.qs.length ? 'Câu tiếp' : 'Xem kết quả'}</button>`;
    }
    return `<div class="box"><div class="stage"><div class="q-head"><span>Câu ${vc.i + 1}/${vc.qs.length}</span><span>Đúng ${vc.score}</span></div><div class="dots">${dots}</div>
      ${prompt}<div class="opts">${opts}</div>${fb}<p class="keys">Phím tắt: 1–4 để chọn · Enter sang câu tiếp</p>
      <button type="button" class="linkbtn" data-act="vq-setup">Dừng bài trắc nghiệm</button></div></div>`;
  }
  const r = vc.score / vc.qs.length;
  const msg = r >= 0.9 ? 'Rất tốt! Bạn đã nắm chắc bài này.' : r >= 0.7 ? 'Khá tốt. Ôn thêm các từ sai rồi làm lại nhé.' : 'Cần ôn thêm. Học lại bằng thẻ nhớ rồi quay lại làm bài.';
  return `<div class="box"><div class="stage"><div class="score">${vc.score}<small>/${vc.qs.length}</small></div><p class="fb">${msg}</p>
    ${vc.missed.length ? `<div class="missed">${vc.missed.map(w => `<span><b>${w.w}</b>${w.m}</span>`).join('')}</div>` : ''}
    <div class="row-btns">${vc.missed.length ? '<button type="button" class="btn primary" data-act="vq-review">Ôn từ sai bằng thẻ nhớ</button>' : ''}
    <button type="button" class="btn${vc.missed.length ? '' : ' primary'}" data-act="vq-start">Làm bài mới</button><button type="button" class="btn" data-act="vq-setup">Đổi cài đặt</button></div></div></div>`;
}
function renderVocab(){
  const T = vc.topic ? TOPICS[vc.topic - 1] : null, ws = vcWords();
  const chips = [{n:0, t:'Tất cả'}, ...TOPICS].map(t => `<button type="button" class="chip txt" data-act="v-topic" data-v="${t.n}" aria-pressed="${t.n === vc.topic}">${t.t}</button>`).join('');
  const scs = [['all','Mọi từ'],['hira','Từ Hiragana'],['kata','Từ Katakana']]
    .map(([v, l]) => `<button type="button" data-act="v-sc" data-v="${v}" aria-pressed="${vc.sc === v}">${l}</button>`).join('');
  const got = ws.filter(w => mastered(w.key)).length;
  const modes = [['list','Danh sách'],['card','Thẻ nhớ'],['quiz','Trắc nghiệm']]
    .map(([v, l]) => `<button type="button" data-act="v-mode" data-v="${v}" aria-pressed="${vc.mode === v}">${l}</button>`).join('');
  const body = vc.mode === 'list' ? vocabList(ws) : vc.mode === 'card' ? vocabCard() : vocabQuiz();
  $('#p-tuvung').innerHTML = `<div class="box"><div class="bar"><div><h2>${T ? T.t : 'Tất cả chủ đề'}</h2><p class="hint">${ws.length} từ · đã thuộc ${got}/${ws.length}</p></div>
    <div class="seg" role="group" aria-label="Cách học">${modes}</div></div><div class="chips" style="margin-top:12px">${chips}</div>
    <div class="bar vfilter"><div class="seg" role="group" aria-label="Lọc theo bảng chữ">${scs}</div>
    <button type="button" class="linkbtn" data-act="v-ro">${vc.ro ? 'Ẩn romaji' : 'Hiện romaji'}</button></div></div><div style="height:10px"></div>${body}`;
}

/* ---------- Reset ---------- */
let resetAsk = false;
function renderReset(){
  $('#reset').innerHTML = resetAsk
    ? '<span>Xoá toàn bộ tiến độ (chữ và từ vựng đã thuộc)?</span><button type="button" class="btn sm again" data-act="reset-yes">Xoá tiến độ</button><button type="button" class="btn sm" data-act="reset-no">Giữ lại</button>'
    : '<span>Tiến độ được lưu trên trình duyệt này.</span><button type="button" class="linkbtn" data-act="reset-ask">Xoá tiến độ</button>';
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act.startsWith('p-')) {
    const isFc = el.dataset.pk === 'fc';
    pickerHandle(isFc ? fc.p : qz.p, act, v);
    if (isFc) { fcReset(); renderFC(); } else { qz.phase = 'setup'; renderQZ(); }
    return;
  }
  switch (act) {
    case 'tab': showTab(v); break;
    case 'say': speak(el.dataset.k); ping(el); break;
    case 'chart-sc': chart.sc = v; renderChart(); break;
    case 'word': {
      const [w, r, m] = WORDS[chart.sc][+el.dataset.i];
      const o = !chart.open.has(w);
      o ? chart.open.add(w) : chart.open.delete(w);
      el.setAttribute('aria-expanded', o);
      el.querySelector('.wr').textContent = o ? `${r} · ${m}` : 'Bấm để xem';
      if (o) speak(w);
      break;
    }
    case 'words-all': {
      const ws = WORDS[chart.sc], all = ws.every(w => chart.open.has(w[0]));
      ws.forEach(w => all ? chart.open.delete(w[0]) : chart.open.add(w[0]));
      renderChart(); break;
    }
    case 'fc-flip': fcFlip(); break;
    case 'fc-again': fcAgain(); break;
    case 'fc-good': fcGood(); break;
    case 'fc-front': fc.front = v; fc.flipped = false; renderFC(); break;
    case 'fc-restart': fcReset(); renderFC(); break;
    case 'fc-toquiz': qz.p = clonePicker(fc.p); qz.phase = 'setup'; showTab('kiemtra'); break;
    case 'q-mode': qz.mode = v; renderQZ(); break;
    case 'q-len': qz.len = +v; renderQZ(); break;
    case 'q-start': qStart(); break;
    case 'q-ans': qAns(+el.dataset.i); break;
    case 'q-next': qNext(); break;
    case 'q-say': speak(qz.qs[qz.i].item.k); break;
    case 'q-setup': qz.phase = 'setup'; renderQZ(); break;
    case 'q-review': fc.p = makePicker(qz.p.script, []); fc.p.custom = qz.missed.slice(); fcReset(); showTab('the'); break;
    case 'v-topic': vc.topic = +v; vcReload(); renderVocab(); break;
    case 'v-sc': vc.sc = v; vcReload(); renderVocab(); break;
    case 'v-ro': vc.ro = !vc.ro; renderVocab(); break;
    case 'v-mode': vc.mode = v; if (v === 'card') vcReset(); if (v === 'quiz') vc.phase = 'setup'; renderVocab(); break;
    case 'v-hide': vc.hide = !vc.hide; vc.open.clear(); renderVocab(); break;
    case 'v-word': {
      const w = vcWords()[+el.dataset.i];
      if (vc.hide) { vc.open.has(w.key) ? vc.open.delete(w.key) : vc.open.add(w.key); renderVocab(); }
      speakJa(w.r); break;
    }
    case 'v-front': vc.front = v; vc.flipped = false; renderVocab(); break;
    case 'v-flip': vcFlip(); break;
    case 'v-again': vcAgain(); break;
    case 'v-good': vcGood(); break;
    case 'v-restart': vcReset(); renderVocab(); break;
    case 'v-toquiz': vc.mode = 'quiz'; vc.phase = 'setup'; renderVocab(); break;
    case 'vq-dir': vc.dir = v; renderVocab(); break;
    case 'vq-start': vqStart(); break;
    case 'vq-ans': vqAns(+el.dataset.i); break;
    case 'vq-next': vqNext(); break;
    case 'vq-len': vc.len = +v; renderVocab(); break;
    case 'vq-say': speakJa(vc.qs[vc.i].item.r); break;
    case 'vq-review': vc.deck = vc.missed.slice(); vc.total = vc.deck.length; vc.known = 0; vc.flipped = false; vc.mode = 'card'; renderVocab(); break;
    case 'vq-setup': vc.phase = 'setup'; renderVocab(); break;
    case 'reset-ask': resetAsk = true; renderReset(); break;
    case 'reset-no': resetAsk = false; renderReset(); break;
    case 'reset-yes': store.stats = {}; save(); resetAsk = false; renderReset(); renderMeters(); fcReset(); vcReload(); showTab(curTab); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.closest && t.closest('input,select,textarea')) return;
  const onBtn = t.closest && t.closest('button');
  if (onBtn && (e.key === ' ' || e.key === 'Enter')) return;
  if (curTab === 'the' && fc.deck.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fcFlip(); }
    else if (fc.flipped && e.key === '1') fcAgain();
    else if (fc.flipped && e.key === '2') fcGood();
  } else if (curTab === 'kiemtra' && qz.phase === 'run') {
    if (qz.picked === null && /^[1-4]$/.test(e.key)) qAns(+e.key - 1);
    else if (qz.picked !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); qNext(); }
  } else if (curTab === 'tuvung' && vc.mode === 'card' && vc.deck.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); vcFlip(); }
    else if (vc.flipped && e.key === '1') vcAgain();
    else if (vc.flipped && e.key === '2') vcGood();
  } else if (curTab === 'tuvung' && vc.mode === 'quiz' && vc.phase === 'run') {
    if (vc.picked === null && /^[1-4]$/.test(e.key)) vqAns(+e.key - 1);
    else if (vc.picked !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); vqNext(); }
  }
});

vcReset();
renderReset();
renderMeters();
const hash = (location.hash || '').replace('#', '');
showTab(TABS.some(t => t[0] === hash) ? hash : (store.tab || 'bang'));
