/* ---------- 2. Flashcards ---------- */
const fc = {p:makePicker('hira', ['a','k']), deck:[], total:0, known:0, flipped:false, front:'kana'};
function fcReset(){ const items = pickerItems(fc.p); fc.deck = shuffle(items.slice()); fc.total = items.length; fc.known = 0; fc.flipped = false; }
function renderFC(){
  let right;
  if (!fc.total) {
    right = '<div class="empty-state"><b>Chưa có thẻ nào</b>Chọn ít nhất một hàng chữ để bắt đầu học.</div>';
  } else if (!fc.deck.length) {
    right = `<div class="stage"><div class="empty-state" style="padding-bottom:8px"><b>Bạn đã nhớ hết ${fc.total} thẻ</b>Kiểm tra lại bộ chữ này để chắc chắn bạn đã thuộc.</div>
      <div class="row-btns"><button type="button" class="btn primary" data-act="fc-toquiz">Kiểm tra bộ này</button><button type="button" class="btn" data-act="fc-restart">Học lại từ đầu</button></div></div>`;
  } else {
    const it = fc.deck[0];
    const two = it.k.length > 1 ? ' two' : '';
    let face;
    if (fc.front === 'kana') face = fc.flipped
      ? `<span class="small">${it.k}</span><span class="rom">${it.r}</span>`
      : `<span class="big${two}">${it.k}</span><span class="tap">Bấm để lật thẻ</span>`;
    else face = fc.flipped
      ? `<span class="big${two}">${it.k}</span><span class="rom">${it.r}</span>`
      : `<span class="rom front">${it.r}</span><span class="tap">Nhớ mặt chữ rồi bấm để lật</span>`;
    const pct = Math.round(fc.known / fc.total * 100);
    right = `<div class="stage">
      <div class="seg" role="group" aria-label="Mặt trước của thẻ"><button type="button" data-act="fc-front" data-v="kana" aria-pressed="${fc.front === 'kana'}">Mặt trước: chữ Nhật</button><button type="button" data-act="fc-front" data-v="romaji" aria-pressed="${fc.front === 'romaji'}">Mặt trước: cách đọc</button></div>
      <div class="stage-top"><div class="progress"><i style="width:${pct}%"></i></div><span>Đã nhớ ${fc.known}/${fc.total} · còn ${fc.deck.length} thẻ</span></div>
      <button type="button" class="flash" data-act="fc-flip" aria-label="Thẻ ghi nhớ, bấm để lật">${face}</button>
      <div class="actions">${fc.flipped
        ? `<button type="button" class="btn again" data-act="fc-again">Chưa nhớ</button><button type="button" class="btn sm" data-act="say" data-k="${it.k}" aria-label="Nghe lại">${ICON.sound}</button><button type="button" class="btn good" data-act="fc-good">Nhớ rồi</button>`
        : '<button type="button" class="btn primary" data-act="fc-flip">Lật thẻ</button>'}</div>
      <p class="keys">Phím tắt: Space để lật · 1 chưa nhớ · 2 nhớ rồi</p></div>`;
  }
  $('#p-the').innerHTML = `<div class="split"><div class="box"><h2>Chọn chữ để học</h2><p class="hint">Thẻ chưa nhớ sẽ quay lại sau vài lượt, cho đến khi bạn nhớ hết.</p>${pickerHTML(fc.p, 'fc')}</div><div class="box">${right}</div></div>`;
}
function fcFlip(){ if (!fc.deck.length) return; fc.flipped = !fc.flipped; if (fc.flipped) speak(fc.deck[0].k); renderFC(); }
function fcAgain(){ const it = fc.deck.shift(); mark(it.k, false); fc.deck.splice(Math.min(3, fc.deck.length), 0, it); fc.flipped = false; renderFC(); }
function fcGood(){ const it = fc.deck.shift(); mark(it.k, true); fc.known++; fc.flipped = false; renderFC(); }

/* ---------- 3. Quiz ---------- */
const qz = {p:makePicker('hira', BASIC), mode:'read', len:10, phase:'setup', qs:[], i:0, score:0, picked:null, results:[], missed:[]};
function weightedOrder(pool){
  return pool.map(it => { const s = store.stats[it.k] || {c:0, w:0}; const w = 1 + 2 * s.w / (s.c + 1); return [Math.pow(Math.random(), 1 / w), it]; })
    .sort((a, b) => b[0] - a[0]).map(x => x[1]);
}
function makeOpts(it, pool){
  const out = [it], used = new Set([it.r]);
  const add = c => { if (out.length < 4 && c && c.k !== it.k && !used.has(c.r)) { out.push(c); used.add(c.r); } };
  const grp = CONF[it.sc].find(g => g.includes(it.k));
  if (grp) shuffle(grp.slice()).forEach(k => add(ITEMS[k]));
  const g = ROWMAP[it.row].g;
  shuffle(pool.filter(x => x.sc === it.sc && ROWMAP[x.row].g === g)).forEach(add);
  shuffle(ALL.filter(x => x.sc === it.sc && ROWMAP[x.row].g === g)).forEach(add);
  shuffle(pool.filter(x => x.sc === it.sc)).forEach(add);
  shuffle(ALL.filter(x => x.sc === it.sc)).forEach(add);
  return shuffle(out);
}
function qStart(){
  const pool = pickerItems(qz.p);
  if (!pool.length) return;
  const qs = []; let bag = [];
  while (qs.length < qz.len) {
    if (!bag.length) bag = weightedOrder(pool);
    const it = bag.shift();
    if (qs.length && qs[qs.length - 1].item === it && pool.length > 1) { bag.push(it); continue; }
    qs.push({item:it, opts:makeOpts(it, pool)});
  }
  Object.assign(qz, {qs, i:0, score:0, picked:null, results:[], missed:[], phase:'run'});
  renderQZ();
  if (qz.mode === 'listen') speak(qs[0].item.k);
}
function qAns(idx){
  if (qz.picked !== null) return;
  const q = qz.qs[qz.i];
  if (!q.opts[idx]) return;
  qz.picked = idx;
  const ok = q.opts[idx] === q.item;
  mark(q.item.k, ok);
  qz.results.push(ok);
  if (ok) qz.score++; else if (!qz.missed.includes(q.item.k)) qz.missed.push(q.item.k);
  if (qz.mode === 'read') speak(q.item.k);
  renderQZ();
}
function qNext(){
  if (qz.picked === null) return;
  qz.i++; qz.picked = null;
  if (qz.i >= qz.qs.length) qz.phase = 'done';
  renderQZ();
  if (qz.phase === 'run' && qz.mode === 'listen') speak(qz.qs[qz.i].item.k);
}

      ${qz.mode === 'listen' ? `<div class="voice-slot">${voiceNote()}</div>` : ''}

  }

}


/* ---------- 4. Vocabulary ---------- */

/* ---------- 5. Grammar ---------- */
const gr = {lesson:1, ans:{}};
const grScore = n => LESSONS[n - 1].q.filter((q, i) => gr.ans[`${n}:${i}`] === q.a).length;
function grSaveBest(){
  const n = gr.lesson, L = LESSONS[n - 1];
  if (!L.q.every((_, i) => gr.ans[`${n}:${i}`] !== undefined)) return;
  const s = grScore(n);
  if (store.gbest[n] === undefined || s > store.gbest[n]) { store.gbest[n] = s; save(); }
}
function renderGrammar(){
  const L = LESSONS[gr.lesson - 1], n = L.n;
  const chips = LESSONS.map(l => `<button type="button" class="chip txt" data-act="g-lesson" data-v="${l.n}" aria-pressed="${l.n === n}">Bài ${l.n}${store.gbest[l.n] !== undefined ? ` · ${store.gbest[l.n]}/${l.q.length}` : ''}</button>`).join('');
  const points = L.g.map((p, i) => `<div class="note"><h3>${i + 1}. ${p.t}</h3><p>${p.p}</p><div class="gex">${p.ex.map(([jp, vi]) =>
    `<button type="button" class="ex-b" data-act="say" data-k="${jp}"><span class="k">${jp}</span><span class="r">${vi}</span></button>`).join('')}</div></div>`).join('');
  const done = L.q.filter((_, i) => gr.ans[`${n}:${i}`] !== undefined).length;
  const qs = L.q.map((q, i) => {
    const key = `${n}:${i}`, a = gr.ans[key], ok = a === q.a;
    const opts = q.o.map((o, j) => {
      let cls = 'opt gopt';
      if (a !== undefined) cls += j === q.a ? ' right' : (j === a ? ' wrong' : ' dim');
      return `<button type="button" class="${cls}" data-act="g-ans" data-q="${key}" data-i="${j}" ${a !== undefined ? 'disabled' : ''}>${o}</button>`;
    }).join('');
    return `<div class="note gq"><p class="hint">Câu ${i + 1}</p>${q.j ? `<p class="gtxt">${q.j}</p>` : ''}<p class="gh">${q.h}</p><div class="gopts">${opts}</div>
      ${a !== undefined ? `<p class="fb ${ok ? 'ok' : 'no'}">${ok ? 'Chính xác!' : 'Chưa đúng.'} ${q.e}</p>` : ''}</div>`;
  }).join('');
  const sum = done === L.q.length
    ? `<div class="gsum"><b>Kết quả: ${grScore(n)}/${L.q.length}</b><button type="button" class="btn sm" data-act="g-redo">Làm lại</button></div>` : '';
  $('#p-nguphap').innerHTML = `<div class="box"><h2>Bài ${n}: ${L.t}</h2><p class="hint">${L.g.length} điểm ngữ pháp và ${L.q.length} câu bài tập. Bấm vào câu ví dụ để nghe.</p><div class="chips" style="margin-top:12px">${chips}</div><div class="voice-slot">${voiceNote()}</div></div>
    <div class="sec"><div class="sec-h"><h2>Ngữ pháp</h2></div><div class="notes gnotes">${points}</div></div>
    <div class="sec"><div class="sec-h"><h2>Bài tập</h2><span>Đã làm ${done}/${L.q.length}</span></div><div class="notes gnotes">${qs}</div>${sum}</div>`;
}

  $('#reset').innerHTML = resetAsk
    ? '<span>Xoá toàn bộ tiến độ (chữ, từ vựng đã thuộc và điểm bài tập)?</span><button type="button" class="btn sm again" data-act="reset-yes">Xoá tiến độ</button><button type="button" class="btn sm" data-act="reset-no">Giữ lại</button>'
    : '<span>Tiến độ được lưu trên trình duyệt này.</span><button type="button" class="linkbtn" data-act="reset-ask">Xoá tiến độ</button>';
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act.startsWith('p-')) {
    const isFc = el.dataset.pk === 'fc';
    pickerHandle(isFc ? fc.p : qz.p, act, v);
    if (isFc) { fcReset(); renderFC(); } else { qz.phase = 'setup'; renderQZ(); }
    return;
  }
  switch (act) {
    case 'tab': showTab(v); break;
    case 'say': speak(el.dataset.k); ping(el); break;
    case 'chart-sc': chart.sc = v; renderChart(); break;
    case 'word': {
      const [w, r, m] = WORDS[chart.sc][+el.dataset.i];
      const o = !chart.open.has(w);
      o ? chart.open.add(w) : chart.open.delete(w);
      el.setAttribute('aria-expanded', o);
      el.querySelector('.wr').textContent = o ? `${r} · ${m}` : 'Bấm để xem';
      if (o) speak(w);
      break;
    }
    case 'words-all': {
      const ws = WORDS[chart.sc], all = ws.every(w => chart.open.has(w[0]));
      ws.forEach(w => all ? chart.open.delete(w[0]) : chart.open.add(w[0]));
      renderChart(); break;
    }
    case 'fc-flip': fcFlip(); break;
    case 'fc-again': fcAgain(); break;
    case 'fc-good': fcGood(); break;
    case 'fc-front': fc.front = v; fc.flipped = false; renderFC(); break;
    case 'fc-restart': fcReset(); renderFC(); break;
    case 'fc-toquiz': qz.p = clonePicker(fc.p); qz.phase = 'setup'; showTab('kiemtra'); break;
    case 'q-mode': qz.mode = v; renderQZ(); break;
    case 'q-len': qz.len = +v; renderQZ(); break;
    case 'q-start': qStart(); break;
    case 'q-ans': qAns(+el.dataset.i); break;
    case 'q-next': qNext(); break;
    case 'q-say': speak(qz.qs[qz.i].item.k); break;
    case 'q-setup': qz.phase = 'setup'; renderQZ(); break;
    case 'q-review': fc.p = makePicker(qz.p.script, []); fc.p.custom = qz.missed.slice(); fcReset(); showTab('the'); break;
    case 'v-lesson': vc.lesson = +v; vcReload(); renderVocab(); break;
    case 'v-mode': vc.mode = v; if (v === 'card') vcReset(); if (v === 'quiz') vc.phase = 'setup'; renderVocab(); break;
    case 'v-hide': vc.hide = !vc.hide; vc.open.clear(); renderVocab(); break;
    case 'v-word': {
      const w = vcWords()[+el.dataset.i];
      if (vc.hide) { vc.open.has(w.key) ? vc.open.delete(w.key) : vc.open.add(w.key); renderVocab(); }
      speakJa(w.r); break;
    }
    case 'v-front': vc.front = v; vc.flipped = false; renderVocab(); break;
    case 'v-flip': vcFlip(); break;
    case 'v-again': vcAgain(); break;
    case 'v-good': vcGood(); break;
    case 'v-restart': vcReset(); renderVocab(); break;
    case 'v-toquiz': vc.mode = 'quiz'; vc.phase = 'setup'; renderVocab(); break;
    case 'vq-dir': vc.dir = v; renderVocab(); break;
    case 'vq-start': vqStart(); break;
    case 'vq-ans': vqAns(+el.dataset.i); break;
    case 'vq-next': vqNext(); break;
    case 'vq-len': vc.len = +v; renderVocab(); break;
    case 'vq-say': speakJa(vc.qs[vc.i].item.r); break;
    case 'vq-review': vc.deck = vc.missed.slice(); vc.total = vc.deck.length; vc.known = 0; vc.flipped = false; vc.mode = 'card'; renderVocab(); break;
    case 'vq-setup': vc.phase = 'setup'; renderVocab(); break;
    case 'g-lesson': gr.lesson = +v; renderGrammar(); break;
    case 'g-ans': {
      const key = el.dataset.q;
      if (gr.ans[key] === undefined) { gr.ans[key] = +el.dataset.i; grSaveBest(); renderGrammar(); }
      break;
    }
    case 'g-redo': Object.keys(gr.ans).forEach(k => { if (k.startsWith(gr.lesson + ':')) delete gr.ans[k]; }); renderGrammar(); break;
    case 'reset-ask': resetAsk = true; renderReset(); break;
    case 'reset-no': resetAsk = false; renderReset(); break;
    case 'reset-yes': store.stats = {}; store.gbest = {}; save(); resetAsk = false; renderReset(); renderMeters(); gr.ans = {}; fcReset(); vcReload(); showTab(curTab); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.closest && t.closest('input,select,textarea')) return;
  const onBtn = t.closest && t.closest('button');
  if (onBtn && (e.key === ' ' || e.key === 'Enter')) return;
  if (curTab === 'the' && fc.deck.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fcFlip(); }
    else if (fc.flipped && e.key === '1') fcAgain();
    else if (fc.flipped && e.key === '2') fcGood();
  } else if (curTab === 'kiemtra' && qz.phase === 'run') {
    if (qz.picked === null && /^[1-4]$/.test(e.key)) qAns(+e.key - 1);
    else if (qz.picked !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); qNext(); }
  } else if (curTab === 'tuvung' && vc.mode === 'card' && vc.deck.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); vcFlip(); }
    else if (vc.flipped && e.key === '1') vcAgain();
    else if (vc.flipped && e.key === '2') vcGood();
  } else if (curTab === 'tuvung' && vc.mode === 'quiz' && vc.phase === 'run') {
    if (vc.picked === null && /^[1-4]$/.test(e.key)) vqAns(+e.key - 1);
    else if (vc.picked !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); vqNext(); }
  }
});

/* ---------- Boot ---------- */
fcReset();
vcReset();
renderReset();
renderMeters();
const hash = (location.hash || '').replace('#', '');
showTab(TABS.some(t => t[0] === hash) ? hash : (store.tab || 'bang'));
window.scrollTo(0, 0);
})();
</script>

</body>
</html>
